openapi: 3.1.0
info:
  title: TeamTaler API
  version: 0.8.0
  description: |
    Same-origin JSON API for TeamTaler. Monetary values use integer minor units:
    response fields are exact decimal strings, while command inputs are bounded
    JSON integers.
    State-changing authenticated requests require the `X-CSRF-Token` header.
    Product creation, invitation CSV imports, and financial mutations that
    create or reverse bookings, payments, or periods additionally require an
    `Idempotency-Key`. A batch-booking idempotency scope includes every managed
    guest created by that command. Versioned role and assignment replacement
    or deletion, public join-link updates, and public join-link rotation require
    a strong `If-Match` ETag.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Authorization
  - name: Groups
  - name: Catalog
  - name: Bookings
  - name: Finance
  - name: Periods
  - name: Operations
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a local session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/capabilities:
    get:
      tags: [Authentication]
      summary: Read public account-recovery capabilities
      description: |
        Reports which email-dependent account actions are available in the
        current deployment. The values are derived from complete SMTP and
        authenticated token-encryption configuration; clients may use them to
        hide unavailable entry points. They are capability hints only and do
        not replace server-side checks on later commands.
      security: []
      responses:
        '200':
          description: Current public authentication capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationCapabilities'
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: |
        Returns the same empty `202` response for known and unknown addresses.
        For an eligible account, the service creates a one-hour, single-use
        request and queues its encrypted token for transactional email
        delivery. The email URL carries the plaintext token only in its
        fragment; the client submits it in the confirmation request body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202': { description: Request accepted without disclosing account existence }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Consume a password-reset token
      description: |
        Replaces the password for the token's account, consumes the token once,
        cancels every other open account-action request, and revokes all
        sessions for that user. The token must come from the reset page URL
        fragment and must never be placed in a request path or query string.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204': { description: Password replaced and all sessions revoked }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/email-change/confirm:
    post:
      tags: [Authentication]
      summary: Consume an email-change token
      description: |
        Replaces the account email only after the mailbox token is verified,
        consumes that token once, cancels every other open account-action
        request, and revokes all sessions for the user. User, membership,
        balance, statement, and audit identifiers remain unchanged. The token
        must come from the confirmation page URL fragment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActionTokenCommand'
      responses:
        '204': { description: Email replaced and all sessions revoked }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /session:
    get:
      tags: [Authentication]
      summary: Read the current session and group memberships
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
  /permission-definitions:
    get:
      tags: [Authorization]
      summary: List stable permission definitions and implication metadata
      description: |
        Returns the application-defined permission registry. Every definition
        currently reports `GROUP` as its only allowed scope. `CATEGORY` and
        `PRODUCT` remain forward-compatible grant shapes, and v1 role mutations
        reject them.
      responses:
        '200':
          description: Stable permission definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionDefinition' }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Authentication]
      summary: Read the current session and group memberships
      description: Compatibility alias for `/session`.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
  /me/profile:
    patch:
      tags: [Authentication]
      summary: Update the current user's display name
      description: Updates the global account name without changing memberships, accounting history, or sessions.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/password:
    put:
      tags: [Authentication]
      summary: Replace the current user's password
      description: |
        Requires the current password. On success every session for the user,
        including the current session, is revoked.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdate'
      responses:
        '204': { description: Password replaced and all sessions revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/email-change:
    post:
      tags: [Authentication]
      summary: Request a verified email-address change
      description: |
        Requires the current password. The current address remains active until
        a one-hour, single-use token sent to `newEmail` is confirmed. Complete
        SMTP and authenticated token-encryption configuration is required. The
        accepted response does not reveal whether another account already uses
        the requested address; in that case no action or email is created.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Verification email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/avatar:
    post:
      tags: [Authentication]
      summary: Validate, normalize, and set the current user's profile image
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Protected content-addressed profile-image URL
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authentication]
      summary: Remove the current user's profile image
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Profile image removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{userId}/avatar/{imageKey}:
    get:
      tags: [Authentication]
      summary: Read the current profile image of a user sharing a group
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: imageKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}\.png$'
      responses:
        '200':
          description: Normalized profile image
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /invitations/preview:
    post:
      tags: [Authentication]
      summary: Resolve safe onboarding hints for a valid invitation token
      description: Rate-limited public lookup that never exposes the invited email address, roles, or category grants.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationPreviewCommand' }
      responses:
        '200':
          description: Safe invitation preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /invitations/accept:
    post:
      tags: [Authentication]
      summary: Consume an invitation and create or validate an account
      description: |
        Ordinary invitations create or reactivate a membership with their
        explicit role selection. A temporary-guest claim invitation instead
        attaches credentials or an authenticated existing account to its
        `targetMembershipId`, preserves that membership's accounting identity,
        and applies exactly the invitation's stored roles. A conflicting
        existing membership returns `409` rather than
        merging financial histories.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '201':
          description: Joined group and authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/preview:
    post:
      tags: [Authentication]
      summary: Resolve safe group metadata for a valid public join link
      description: |
        Rate-limited public lookup. The opaque join token is supplied from the
        URL fragment by the client and is never included in server access-log
        URLs. The response exposes neither role data nor group identifiers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinTokenCommand' }
      responses:
        '200':
          description: Safe public join-link preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations:
    post:
      tags: [Authentication]
      summary: Start an email-verified account registration through a public link
      description: |
        Queues a one-time verification email for a new account. The accepted
        response is deliberately identical when the normalized email already
        belongs to an account, preventing account enumeration. A membership is
        created only after verification and receives the group's current
        default role at that later point in time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinRegistration' }
      responses:
        '202':
          description: Verification processing accepted without disclosing account existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations/resend:
    post:
      tags: [Authentication]
      summary: Replace and resend a pending public registration proof
      description: Returns the same accepted response when no matching pending registration exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinResendCommand' }
      responses:
        '202':
          description: Verification processing accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations/confirm:
    post:
      tags: [Authentication]
      summary: Verify a public registration and create its account and membership
      description: |
        Atomically consumes the one-time mailbox proof, creates the account and
        membership, assigns the group's current default role, and creates a
        session. Link rotation or deactivation invalidates every pending proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinVerificationCommand' }
      responses:
        '201':
          description: Verified account, membership, and authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/accept:
    post:
      tags: [Authentication]
      summary: Join through a public link with the current authenticated account
      description: |
        Active memberships are returned idempotently. Archived memberships are
        reactivated after their role set is atomically replaced by the group's
        current default role.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinTokenCommand' }
      responses:
        '200':
          description: Joined group and refreshed session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups:
    get:
      tags: [Groups]
      summary: List groups available to the current user
      responses:
        '200':
          description: Active group memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
    post:
      tags: [Groups]
      summary: Create a group owned by the current user
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currency]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        '201':
          description: Created group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}:
    patch:
      tags: [Groups]
      summary: Update group identity with GROUP_ADMINISTRATION
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Persisted normalized group settings
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/settings:
    get:
      tags: [Groups]
      summary: Read GROUP_ADMINISTRATION-managed group behavior settings
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Current typed group settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSettings' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Groups]
      summary: Partially update GROUP_ADMINISTRATION-managed group behavior settings
      description: Updates notification-email delivery behavior for the group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupSettingsUpdate' }
      responses:
        '200':
          description: Persisted typed group settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupSettings' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/dashboard:
    get:
      tags: [Groups]
      summary: Read the active member dashboard
      description: |
        Returns the authenticated membership's personal account data.
        `groupCategoryStatistics` is an empty array without
        `VIEW_GROUP_STATISTICS`. `groupOutstandingMinor` remains independently
        available only with `FINANCE_MANAGEMENT`; its omission must not be
        interpreted as a zero group balance.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/logo:
    post:
      tags: [Groups]
      summary: Validate, normalize, and set the group logo
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Normalized group-logo URL
          content:
            application/json:
              schema:
                type: object
                required: [logoUrl]
                properties:
                  logoUrl: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Restore the default TeamTaler logo for the group
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Custom group logo removed }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members:
    get:
      tags: [Groups]
      summary: List group members and effective permissions
      description: |
        Requires `VIEW_MEMBER_DIRECTORY`. `BOOK_FOR_OTHERS` implies that
        permission. Callers that only need valid booking targets must use the
        privacy-minimized `/booking-context` read model instead of this
        administrative directory.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group members
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/booking-context:
    get:
      tags: [Bookings]
      summary: Read the privacy-minimized context required by the booking workspace
      description: |
        Requires `CREATE_OWN_BOOKING`, `BOOK_FOR_OTHERS`, or `BOOK_FOR_GUESTS`.
        The response never
        includes the group member directory, email addresses, role assignments,
        effective grants for other memberships, or group statistics. Targets
        are filtered independently: own access needs
        `CREATE_OWN_BOOKING`, credentialed members need `BOOK_FOR_OTHERS`, and
        credentialless temporary guests need `BOOK_FOR_GUESTS`. Temporary guests
        sort after credentialed members. `canBookForGuests` also controls inline
        temporary-guest creation.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Minimal current-period, own-balance, and target context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingContext' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/public-join-link:
    get:
      tags: [Groups]
      summary: Read the administrator-managed public join-link state
      description: |
        Requires `GROUP_ADMINISTRATION`. The reusable acceptance URL is returned
        only while the single group link is enabled and unexpired. Version zero
        represents a group that has never created a link.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Current public join-link state
          headers:
            ETag:
              description: Strong ETag when a persisted link exists.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Groups]
      summary: Create, enable, disable, or change the lifetime of a public join link
      description: |
        Requires `GROUP_ADMINISTRATION`. The first persisted version omits
        `If-Match`; later replacements require the current strong ETag. Enabling
        a disabled or expired link creates a new token. A null expiry means
        unlimited availability. Enabling requires configured email delivery and
        a non-administrative group default role.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinLinkUpdate' }
      responses:
        '200':
          description: Persisted public join-link state
          headers:
            ETag:
              description: Strong ETag derived from the returned version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/public-join-link/rotate:
    post:
      tags: [Groups]
      summary: Replace the current public join-link token
      description: |
        Requires `GROUP_ADMINISTRATION` and an enabled, unexpired link. Rotation
        invalidates the previous URL, QR code, and all pending registrations in
        the same write transaction while preserving the configured expiry.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Rotated public join-link state
          headers:
            ETag:
              description: Strong ETag derived from the incremented version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/roles:
    get:
      tags: [Authorization]
      summary: List group-owned roles and assignment counts
      description: Requires `ROLE_MANAGEMENT` or `GROUP_ADMINISTRATION` in the requested group. Group-administration-only clients use this read model solely to identify the protected reserved role for transfer.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Roles with explicit grants, versions, protection metadata, and assignment counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Authorization]
      summary: Create a group-owned role
      description: |
        Requires `ROLE_MANAGEMENT`. A role containing
        `GROUP_ADMINISTRATION` additionally requires
        `GROUP_ADMINISTRATION`. Only `GROUP` grants are accepted in v1.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCommand' }
      responses:
        '201':
          description: Created role
          headers:
            ETag:
              description: Strong ETag derived from the returned role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/roles/{roleId}:
    get:
      tags: [Authorization]
      summary: Read one group-owned role
      description: Requires `ROLE_MANAGEMENT` in the requested group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Current role
          headers:
            ETag:
              description: Strong ETag derived from the returned role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Authorization]
      summary: Replace a role name, description, and explicit grants
      description: |
        Requires `ROLE_MANAGEMENT`. Changing `GROUP_ADMINISTRATION` or the
        reserved administrator role additionally requires
        `GROUP_ADMINISTRATION`. The reserved role name and core grants are
        immutable. Only `GROUP` grants are accepted in v1.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCommand' }
      responses:
        '200':
          description: Updated role
          headers:
            ETag:
              description: Strong ETag derived from the incremented role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authorization]
      summary: Delete an unused editable role
      description: |
        Requires `ROLE_MANAGEMENT` and a matching role version. The reserved
        group-administrator role cannot be deleted; deleting an editable role that contains
        `GROUP_ADMINISTRATION` additionally requires that permission. A role
        assigned to an active membership or pending invitation returns `409`
        with both assignment counts. Expired invitation assignments do not
        block deletion and are removed by cascade.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Role deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/RoleConflictProblem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/role-assignments:
    get:
      tags: [Authorization]
      summary: List aggregated member and pending-invitation role assignments
      description: Requires `ROLE_MANAGEMENT` or `GROUP_ADMINISTRATION` in the requested group. Mutation rules still restrict group-administration-only callers to the reserved administrator assignment.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: One complete role-ID set and version per assignment subject
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/roles:
    put:
      tags: [Authorization]
      summary: Replace all role assignments for an active membership
      description: |
        At least one role must remain assigned. Ordinary role assignments
        require `ROLE_MANAGEMENT`. Reserved administrator
        assignment changes require `GROUP_ADMINISTRATION`; assigning any other
        role containing that permission requires both `ROLE_MANAGEMENT` and
        `GROUP_ADMINISTRATION`. The last active reserved administrator
        assignment cannot be removed.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentUpdate' }
      responses:
        '200':
          description: Replaced membership role assignments
          headers:
            ETag:
              description: Strong ETag derived from the incremented assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/permissions:
    patch:
      tags: [Groups]
      summary: Replace deprecated preset-role and legacy permission fields
      description: |
        Deprecated compatibility adapter. Preset-role writes preserve custom
        role assignments, `SELF_RECORD_PAYMENT` is mapped through the editable
        migration role, and every non-empty `categoryGrants` value returns
        `422`. Assignment changes use the same authorization policy as the
        dynamic role API and require the current assignment ETag.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionUpdate' }
      responses:
        '204':
          description: Permissions replaced
          headers:
            ETag:
              description: Strong ETag derived from the resulting assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}:
    patch:
      tags: [Groups]
      summary: Rename an active temporary guest
      description: |
        Requires `GROUP_ADMINISTRATION`. Only an active credentialless temporary
        guest may be renamed through this endpoint. Credentialed members manage
        their global display name through account flows.
        The normalized display name is written with an audit event. Repeating
        the same replacement is naturally idempotent and needs no
        `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemporaryGuestRenameCommand' }
      responses:
        '200':
          description: Renamed temporary guest membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Archive a membership while preserving all historical records
      description: |
        Requires `GROUP_ADMINISTRATION`. The same lifecycle applies to regular
        memberships and temporary guests. Archival clears
        effective access while preserving the stable membership identifier,
        credentialless identity, bookings, ledger entries, period statements,
        claim-invitation history, notifications, and audit events.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - name: confirmSelf
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Must be true when a member with `GROUP_ADMINISTRATION` archives their own membership.
      responses:
        '204': { description: Membership archived and effective permissions cleared }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/reactivate:
    post:
      tags: [Groups]
      summary: Reactivate an archived membership
      description: |
        Requires `GROUP_ADMINISTRATION`. Credentialed memberships must receive
        at least one role. Without `ROLE_MANAGEMENT`, the only accepted role set
        is the group's current default role. Temporary guests remain roleless
        and may provide a conflict-free replacement display name. Permanently
        deleted memberships cannot be reactivated.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberReactivationCommand' }
      responses:
        '200':
          description: Reactivated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/permanent:
    delete:
      tags: [Groups]
      summary: Permanently remove an archived membership from administration
      description: |
        Requires `GROUP_ADMINISTRATION` and an exact zero consolidated balance.
        The membership identifier and its last display name remain as a
        credentialless tombstone for bookings, payments, ledger entries,
        statements, and audit history. The original account and memberships in
        other groups remain unchanged. Later financial corrections and booking
        reversals may create a new balance on the deleted tombstone account.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Membership removed from administration; historical tombstone retained }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/claim-invitation:
    post:
      tags: [Groups]
      summary: Invite an active temporary guest to claim login access
      description: |
        Requires `GROUP_ADMINISTRATION`. The command creates one seven-day,
        single-use invitation tied to the active credentialless membership and
        records its email outbox work atomically when SMTP is available. The
        fallback URL is returned once. The command accepts no
        `Idempotency-Key`: at most one open claim invitation may target a guest,
        and a repeated request returns `409` without rotating the token or
        sending another message.

        Acceptance preserves the target membership identifier and every
        accounting and audit reference. A new claimant receives credentials on
        the temporary identity; an existing account must authenticate and is
        linked without creating a second membership. At least one role is stored
        with the invitation and applied exactly on acceptance. Without
        `ROLE_MANAGEMENT`, only the current default role is accepted; other role
        sets require `ROLE_MANAGEMENT`, and protected-role rules still apply.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemporaryGuestClaimInvitationCommand' }
      responses:
        '201':
          description: Claim invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryGuestClaimInvitationResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations:
    get:
      tags: [Groups]
      summary: List invitation metadata without secret tokens
      description: |
        `GROUP_ADMINISTRATION` returns the complete invitation lifecycle.
        `ROLE_MANAGEMENT` alone returns only currently open ordinary invitations
        needed for role assignment and cannot see temporary-guest claim invitations
        or create, revoke, or resend any invitation.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Groups]
      summary: Create a seven-day, one-time invitation and optionally queue its email
      description: |
        When SMTP delivery is configured, the invitation and its encrypted
        transactional outbox job are committed atomically. The one-time
        acceptance URL is returned regardless of SMTP availability so a group
        administrator can use it as a fallback. A current invitation or group
        membership for the normalized email address prevents duplicates across
        manual creation and CSV imports. Selected `roleIds` and deprecated role
        fields apply the same role-management and administrator-capable-role
        checks as the dedicated assignment endpoint. At least one role must be
        selected explicitly.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCommand' }
      responses:
        '201':
          description: Invitation with delivery status and one-time fallback acceptance URL
          content:
            application/json:
              schema:
                type: object
                required: [invitation, acceptUrl]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  acceptUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/import:
    post:
      tags: [Groups]
      summary: Import invitations with row-specific roles or the group default
      description: |
        Accepts UTF-8 CSV with a required `email` column and an optional
        `display_name` and `roles` columns. Multiple case-insensitive role names
        in one row are separated by `|`. A blank roles cell uses the deprecated
        shared `roleId` parameters when present, otherwise the group's default
        role. Comma and semicolon separators and an optional UTF-8 BOM are
        supported. Valid rows are committed together with an encrypted
        transactional email-outbox job. A membership is created only after the
        recipient accepts the invitation.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: roleId
          in: query
          required: false
          deprecated: true
          description: Deprecated shared fallback. Repeat for every group-owned role assigned to rows without a roles value.
          schema: { type: array, uniqueItems: true, items: { type: string } }
          style: form
          explode: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              maxLength: 262144
              examples:
                - |-
                  email,display_name,roles
                  alex@example.com,Alex Member,Member
                  sam@example.com,Sam Member,Finance manager|Catalog manager
      responses:
        '200':
          description: Complete or partial row-level import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationImportResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}:
    patch:
      tags: [Groups]
      summary: Replace display-name and compatible role defaults of an open invitation
      description: |
        Both `roleIds` and deprecated role fields use the current assignment
        policy and require a matching `If-Match`. Legacy role fields preserve
        custom assignments. Non-empty legacy category grants return `422`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationUpdate' }
      responses:
        '200':
          description: Updated invitation metadata
          headers:
            ETag:
              description: Strong ETag derived from the current invitation assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Revoke an open invitation and cancel unsent email delivery
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Invitation revoked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/roles:
    put:
      tags: [Authorization]
      summary: Replace all role assignments for an ordinary pending invitation
      description: |
        Managed-guest claim invitations have a server-owned guest-role
        assignment and return `409` from this operation.
        At least one role must remain assigned. Ordinary role assignments
        require `ROLE_MANAGEMENT`. Changing the reserved
        administrator-role assignment requires `GROUP_ADMINISTRATION`; changing
        another role containing that permission requires both `ROLE_MANAGEMENT`
        and `GROUP_ADMINISTRATION`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentUpdate' }
      responses:
        '200':
          description: Replaced pending-invitation role assignments
          headers:
            ETag:
              description: Strong ETag derived from the incremented assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/email/retry:
    post:
      tags: [Groups]
      summary: Retry a terminally failed invitation email
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Email returned to the delivery queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEmailRetryResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/email/resend:
    post:
      tags: [Groups]
      summary: Rotate and resend an open invitation
      description: Creates a new token and seven-day expiry. Older links become invalid; PENDING and SENDING deliveries are rejected.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rotated invitation queued for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEmailResendResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories:
    get:
      tags: [Catalog]
      summary: List categories with nested products
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Catalog]
      summary: Create a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCommand' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/catalog/order:
    put:
      tags: [Catalog]
      summary: Replace the category and product display order
      description: Atomically persists the complete catalog order. Every category and every product in its owning category must appear exactly once; products cannot be moved between categories.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogOrderCommand' }
      responses:
        '200':
          description: Reordered catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories/{categoryId}:
    patch:
      tags: [Catalog]
      summary: Update or archive a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Catalog]
      summary: Permanently delete an archived, empty, unused category
      description: The category must already be archived, contain no products, and have no booking or ledger history. Historical categories remain archived instead.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Category permanently deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories/{categoryId}/products:
    post:
      tags: [Catalog]
      summary: Create a product in a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCommand' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/products/{productId}:
    patch:
      tags: [Catalog]
      summary: Update or archive a product
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Catalog]
      summary: Permanently remove an archived product from the catalog
      description: The product must already be archived. Unused products are physically deleted; products referenced by bookings retain an internal tombstone so immutable booking, ledger, settlement, and audit history remains intact. Removed products are no longer returned by catalog APIs and cannot be restored through the API.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Product permanently removed from the catalog }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/products/{productId}/image:
    post:
      tags: [Catalog]
      summary: Validate, normalize, and attach a product image
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Normalized image URL
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/images/{imageKey}:
    get:
      tags: [Catalog]
      summary: Read a group-referenced immutable product image or group logo
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: imageKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}\.png$'
      responses:
        '200':
          description: Normalized PNG image
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Image not found }
  /groups/{groupId}/bookings:
    get:
      tags: [Bookings]
      summary: List activity bookings visible to the current member
      description: Members with `VIEW_ALL_BOOKING_ACTIVITY`, including through the `VOID_ANY_BOOKING` implication, see complete group history. Other active members see actor- and target-relevant activity. Each item includes server-resolved actor and target display names so this read does not require `VIEW_MEMBER_DIRECTORY`. This endpoint does not broaden account visibility.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: periodId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Visible booking snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
    post:
      tags: [Bookings]
      summary: Create an immutable booking and balanced ledger entries
      description: |
        `CREATE_OWN_BOOKING` permits charging the authenticated membership. A
        different credentialed target requires `BOOK_FOR_OTHERS` and a non-empty
        reason. An existing temporary guest requires `BOOK_FOR_GUESTS` and no
        reason. Inline temporary-guest creation is available through the batch
        command.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCommand' }
      responses:
        '201':
          description: Created booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/bookings/{bookingId}/void:
    post:
      tags: [Bookings]
      summary: Create an audited permission-gated booking reversal in the open period
      description: |
        `VOID_OWN_BOOKING` covers the current booking actor or charged target.
        Only the actor may omit the reason during the first 30 seconds; later
        actor reversals and target reversals of incoming third-party bookings
        require a reason. A member who is neither actor nor target requires
        `VOID_ANY_BOOKING` and a reason.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Voided booking snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/accounts:
    get:
      tags: [Finance]
      summary: List consolidated member balances with FINANCE_MANAGEMENT
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Active and archived group membership balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountSummary' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/accounts/me:
    get:
      tags: [Finance]
      summary: Read the current member account
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Consolidated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /groups/{groupId}/accounts/{membershipId}:
    get:
      tags: [Finance]
      summary: Read a member account with FINANCE_MANAGEMENT
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Consolidated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments:
    get:
      tags: [Finance]
      summary: List incoming payments
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Finance]
      summary: Record and FIFO-allocate an incoming payment
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCommand' }
      responses:
        '201':
          description: Recorded payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/bookings/batch:
    post:
      tags: [Bookings]
      summary: Atomically create the same booking for existing members and new temporary guests
      description: |
        Creates one immutable booking and balanced ledger pair per unique active
        target membership in a single transaction. Selecting the current
        membership requires `CREATE_OWN_BOOKING`; selecting another credentialed
        membership requires `BOOK_FOR_OTHERS` and a non-empty shared reason.
        Selecting an existing temporary guest or supplying
        `temporaryGuestDisplayNames` requires `BOOK_FOR_GUESTS` and no reason.

        Each temporary guest name creates a credentialless user, a deliberately
        roleless active membership, and its booking inside the same transaction.
        Existing target IDs and new names together are limited to 100. Active
        temporary-guest names are
        case-insensitively unique within the group. Any invalid, duplicate,
        archived, or
        cross-group target, unsafe guest configuration, accounting conflict, or
        notification failure rejects the complete command, including all new
        identities. A name conflict never merges automatically; its `409`
        Problem Details includes `existingMembershipId` so the caller may
        explicitly select that active guest in a later command.

        The idempotency payload includes the normalized names and all booking
        fields. A replay returns the original bookings and guest membership IDs;
        reuse of the key with any different payload returns `409`. Responses are
        ordered by `targetMembershipIds` first and then by
        `temporaryGuestDisplayNames`, preserving each request array's order.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingBatchCommand' }
      responses:
        '201':
          description: Created booking snapshots in target request order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments/self:
    post:
      tags: [Finance]
      summary: Record and FIFO-allocate a payment for the authenticated membership
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfPaymentCommand' }
      responses:
        '201':
          description: Recorded self-service payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments/{paymentId}/reverse:
    post:
      tags: [Finance]
      summary: Reverse a payment and rebuild FIFO allocations
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '204': { description: Payment reversed }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/periods:
    get:
      tags: [Periods]
      summary: List accounting periods
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Newest-first periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Period' }
  /groups/{groupId}/periods/{periodId}/close:
    post:
      tags: [Periods]
      summary: Permanently close a period and open its successor
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePeriodCommand' }
      responses:
        '200':
          description: Closed period, successor, and snapshot count
          content:
            application/json:
              schema:
                type: object
                required: [closedPeriod, openPeriod, statementCount]
                properties:
                  closedPeriod: { $ref: '#/components/schemas/Period' }
                  openPeriod: { $ref: '#/components/schemas/Period' }
                  statementCount: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/periods/{periodId}/statements:
    get:
      tags: [Periods]
      summary: Read statements for one closed period
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: Visible statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
  /groups/{groupId}/settlements:
    get:
      tags: [Periods]
      summary: List visible settlement statements
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: periodId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Settlement statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
  /groups/{groupId}/notifications:
    get:
      tags: [Groups]
      summary: List current member notifications
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          description: Opaque notification identifier returned in the preceding X-Next-Cursor header.
          schema: { type: string }
      responses:
        '200':
          description: Notifications
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next older page; omitted for the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /groups/{groupId}/notifications/summary:
    get:
      tags: [Groups]
      summary: Read the current member's exact unread notification count
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Unread notification summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSummary' }
  /groups/{groupId}/notifications/read:
    patch:
      tags: [Groups]
      summary: Acknowledge visible notifications in one bounded batch
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notificationIds]
              properties:
                notificationIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, minLength: 1 }
      responses:
        '200':
          description: Batch acknowledgement result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NotificationSummary'
                  - type: object
                    required: [readAt]
                    properties:
                      readAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/notifications/{notificationId}:
    patch:
      tags: [Groups]
      summary: Mark one notification read or unread
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
  /groups/{groupId}/audit:
    get:
      tags: [Groups]
      summary: List append-only administrative audit events
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '403': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      tags: [Operations]
      summary: Process liveness probe
      security: []
      servers:
        - url: /
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      tags: [Operations]
      summary: Database readiness probe
      security: []
      servers:
        - url: /
      responses:
        '200': { description: Database is ready }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: teamtaler_session
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional strong resource ETag; conditionally required by commands that include versioned role assignments.
      schema: { type: string }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong entity tag containing the current resource version, for example `"v3"`.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RoleConflictProblem:
      description: RFC 9457 conflict details including current role assignment counts
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RoleConflictProblem' }
  schemas:
    MinorUnits:
      type: string
      pattern: '^-?[0-9]+$'
      description: Exact signed integer amount in the currency's minor unit, encoded as a decimal string to preserve 64-bit precision in browsers.
      examples: ['1250']
    LoginCommand:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 1024 }
    AuthenticationCapabilities:
      type: object
      additionalProperties: false
      required: [passwordResetAvailable, emailChangeAvailable]
      properties:
        passwordResetAvailable:
          type: boolean
          readOnly: true
          description: Whether password-reset email delivery is currently configured.
        emailChangeAvailable:
          type: boolean
          readOnly: true
          description: Whether verified email-address changes are currently configured.
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordResetConfirmation:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: One-time token read by the client from the reset URL fragment.
        newPassword: { type: string, format: password, minLength: 12, maxLength: 1024 }
    AccountActionTokenCommand:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: One-time token read by the client from the confirmation URL fragment.
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
    PasswordUpdate:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 1024 }
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [newEmail, currentPassword]
      properties:
        newEmail: { type: string, format: email, maxLength: 254 }
        currentPassword: { type: string, format: password, minLength: 1, maxLength: 1024 }
    InvitationAcceptance:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        displayName:
          type: string
          maxLength: 120
          description: Required for a new account and ignored for an existing account.
        password: { type: string, format: password, minLength: 12, maxLength: 1024 }
    InvitationPreviewCommand:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    InvitationPreview:
      type: object
      required: [displayName, existingAccount]
      additionalProperties: false
      properties:
        displayName: { type: string, maxLength: 120 }
        existingAccount: { type: boolean }
    PublicJoinTokenCommand:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: Opaque URL-fragment token that is hashed before lookup.
    PublicJoinRegistration:
      type: object
      additionalProperties: false
      required: [joinToken, email, displayName, password]
      properties:
        joinToken: { type: string, minLength: 1 }
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        password: { type: string, format: password, minLength: 12, maxLength: 1024 }
    PublicJoinResendCommand:
      type: object
      additionalProperties: false
      required: [joinToken, email]
      properties:
        joinToken: { type: string, minLength: 1 }
        email: { type: string, format: email, maxLength: 254 }
    PublicJoinVerificationCommand:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          description: One-time mailbox-verification token from the URL fragment.
    PublicJoinPreview:
      type: object
      additionalProperties: false
      required: [groupName, expiresAt]
      properties:
        groupName: { type: string, minLength: 1, maxLength: 120 }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Null for an unlimited public link.
    VerificationRequired:
      type: object
      additionalProperties: false
      required: [verificationRequired]
      properties:
        verificationRequired: { const: true }
    PublicJoinLink:
      type: object
      additionalProperties: false
      required: [enabled, expired, expiresAt, version, emailVerificationAvailable]
      properties:
        enabled:
          type: boolean
          description: Persisted administrator-controlled state.
        expired:
          type: boolean
          readOnly: true
          description: True when an enabled link has reached its finite expiry.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Null for unlimited availability or a disabled link.
        acceptUrl:
          type: string
          format: uri
          readOnly: true
          description: Present only for an enabled and unexpired link. The secret remains in the URL fragment.
        version:
          type: integer
          format: int64
          minimum: 0
          description: Zero means no public join-link resource has been persisted yet.
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
        emailVerificationAvailable:
          type: boolean
          readOnly: true
          description: Whether SMTP delivery and authenticated token encryption are configured.
    PublicJoinLinkUpdate:
      type: object
      additionalProperties: false
      required: [enabled, expiresAt]
      properties:
        enabled: { type: boolean }
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Null means unlimited while enabled; finite values must be between one hour and 365 days in the future.
    Session:
      type: object
      required: [user, csrfToken, groups]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        activeGroupId:
          type: [string, 'null']
    User:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: string }
    Group:
      type: object
      required: [id, name, currency, membership]
      properties:
        id: { type: string }
        name: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        logoUrl: { type: string }
        membership: { $ref: '#/components/schemas/Membership' }
    GroupSettings:
      type: object
      additionalProperties: false
      required: [notificationEmailsEnabled, notificationEmailDeliveryAvailable, defaultRoleId]
      properties:
        notificationEmailsEnabled:
          type: boolean
          description: Persisted group preference for companion emails on future in-app notifications.
        notificationEmailDeliveryAvailable:
          type: boolean
          readOnly: true
          description: Whether the running server has complete SMTP delivery configuration.
        defaultRoleId:
          type: [string, 'null']
          description: Group-owned non-administrative role preselected for new invitations and used by CSV rows without roles.
    GroupSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notificationEmailsEnabled: { type: boolean }
        defaultRoleId:
          type: string
          minLength: 1
          description: Group-owned role that must not grant GROUP_ADMINISTRATION. It cannot be cleared after being set.
    Membership:
      type: object
      required: [id, groupId, userId, displayName, isTemporaryGuest, status, roleIds, effectiveGrants, roleAssignmentsVersion, roles, groupPermissions, categoryGrants]
      properties:
        id: { type: string }
        groupId: { type: string }
        userId:
          type: string
          description: Required identity reference. A temporary guest points to a credentialless user; claiming with an existing account may rebind this field while the membership id and accounting history remain stable.
        email:
          type: [string, 'null']
          format: email
          description: Omitted or null only for a credentialless temporary guest; synthetic addresses are never generated.
        displayName: { type: string }
        isTemporaryGuest:
          type: boolean
          readOnly: true
          description: Server-derived only from missing email and password credentials.
        avatarUrl: { type: string }
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DELETED]
          description: DELETED is a retained historical tombstone that is excluded from the member directory.
        roleIds:
          type: array
          uniqueItems: true
          description: Stable identifiers of every assigned group-owned role.
          items: { type: string }
        effectiveGrants:
          type: array
          uniqueItems: true
          readOnly: true
          description: Union of assigned role grants after permission implications are expanded.
          items: { $ref: '#/components/schemas/PermissionGrant' }
        roleAssignmentsVersion:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Whole-assignment-set version used to construct the membership roles ETag.
        roles:
          type: array
          uniqueItems: true
          deprecated: true
          description: Deprecated legacy preset-role strings derived from current preset assignments.
          items: { $ref: '#/components/schemas/LegacyRole' }
        groupPermissions:
          type: array
          uniqueItems: true
          deprecated: true
          description: Deprecated compatibility projection for migrated self-payment access.
          items: { $ref: '#/components/schemas/GroupPermission' }
        categoryGrants:
          deprecated: true
          description: Deprecated compatibility field; always empty after migration `0017`.
          $ref: '#/components/schemas/LegacyCategoryGrants'
    PermissionKey:
      type: string
      enum:
        - GROUP_ADMINISTRATION
        - ROLE_MANAGEMENT
        - FINANCE_MANAGEMENT
        - CATALOG_MANAGEMENT
        - VIEW_MEMBER_DIRECTORY
        - VIEW_GROUP_STATISTICS
        - VIEW_ALL_BOOKING_ACTIVITY
        - RECORD_OWN_PAYMENT
        - CREATE_OWN_BOOKING
        - VOID_OWN_BOOKING
        - VOID_ANY_BOOKING
        - BOOK_FOR_OTHERS
        - BOOK_FOR_GUESTS
    PermissionScopeType:
      type: string
      enum: [GROUP, CATEGORY, PRODUCT]
    PermissionScope:
      description: Tenant-bound permission resource scope. Only the GROUP variant is accepted by v1 mutations.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: GROUP }
        - type: object
          additionalProperties: false
          required: [type, categoryId]
          properties:
            type: { const: CATEGORY }
            categoryId: { type: string }
        - type: object
          additionalProperties: false
          required: [type, productId]
          properties:
            type: { const: PRODUCT }
            productId: { type: string }
    PermissionDefinition:
      type: object
      additionalProperties: false
      required: [key, description, allowedScopes, implies]
      properties:
        key: { $ref: '#/components/schemas/PermissionKey' }
        description:
          type: string
          maxLength: 500
          description: Stable English technical explanation; localized UI labels and help text remain client-owned.
        allowedScopes:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/PermissionScopeType' }
        implies:
          type: array
          uniqueItems: true
          description: Permission keys transitively included by this permission.
          items: { $ref: '#/components/schemas/PermissionKey' }
    PermissionGrant:
      type: object
      additionalProperties: false
      required: [permission, scope]
      properties:
        permission: { $ref: '#/components/schemas/PermissionKey' }
        scope: { $ref: '#/components/schemas/PermissionScope' }
    RolePresetKey:
      type: string
      enum: [GROUP_ADMINISTRATOR, MEMBER, FINANCE_MANAGER, CATALOG_MANAGER]
    Role:
      type: object
      additionalProperties: false
      required: [id, groupId, name, description, nameLocked, deletable, grants, version, memberCount, pendingInvitationCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        presetKey: { $ref: '#/components/schemas/RolePresetKey' }
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed, control-character-free, and case-insensitively unique within the group.
        description: { type: string, maxLength: 500 }
        nameLocked:
          type: boolean
          description: True only when the role name is protected from changes.
        deletable:
          type: boolean
          description: False for protected presets; an assigned editable role still returns a deletion conflict.
        grants:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionGrant' }
        version: { type: integer, format: int64, minimum: 1 }
        memberCount: { type: integer, format: int64, minimum: 0 }
        pendingInvitationCount: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoleCommand:
      type: object
      additionalProperties: false
      required: [name, grants]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed, control-character-free, and case-insensitively unique within the group.
        description:
          type: string
          maxLength: 500
          description: Trimmed and control-character-free role explanation.
        grants:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionGrant' }
    RoleAssignmentSubjectType:
      type: string
      enum: [MEMBERSHIP, INVITATION]
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, roleIds, version]
      properties:
        subjectType: { $ref: '#/components/schemas/RoleAssignmentSubjectType' }
        subjectId: { type: string }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
    RoleAssignmentUpdate:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    LegacyRole:
      type: string
      deprecated: true
      enum: [ADMIN, FINANCE_MANAGER, CATALOG_MANAGER]
    GroupPermission:
      type: string
      deprecated: true
      enum: [SELF_RECORD_PAYMENT]
    CategoryPermission:
      type: string
      deprecated: true
      enum: [ASSIGN_TO_OTHERS, VOID_BOOKINGS]
    LegacyCategoryGrants:
      type: object
      deprecated: true
      additionalProperties:
        type: array
        uniqueItems: true
        items: { $ref: '#/components/schemas/CategoryPermission' }
    LegacyCategoryGrantWrite:
      type: object
      deprecated: true
      maxProperties: 0
      additionalProperties: false
      description: Must be empty; non-empty legacy category grants return `422`.
    PermissionUpdate:
      type: object
      required: [roles, categoryGrants]
      properties:
        roles:
          type: array
          uniqueItems: true
          deprecated: true
          description: Replaces only legacy preset assignments and preserves every custom role assignment.
          items: { $ref: '#/components/schemas/LegacyRole' }
        groupPermissions:
          type: array
          uniqueItems: true
          deprecated: true
          items: { $ref: '#/components/schemas/GroupPermission' }
        categoryGrants:
          $ref: '#/components/schemas/LegacyCategoryGrantWrite'
    TemporaryGuestRenameCommand:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed, control-character-free replacement display name.
    MemberReactivationCommand:
      type: object
      additionalProperties: false
      required: [roleIds]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional replacement name for an archived temporary guest; ignored for credentialed memberships.
        roleIds:
          type: array
          uniqueItems: true
          description: Complete role set for a credentialed membership. Temporary guests must provide an empty array.
          items: { type: string, minLength: 1 }
    TemporaryGuestClaimInvitationCommand:
      type: object
      additionalProperties: false
      required: [email, roleIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    TemporaryGuestClaimInvitationResult:
      type: object
      additionalProperties: false
      required: [invitation, acceptUrl]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        acceptUrl:
          type: string
          description: Secret-bearing fallback URL returned only when the conflict-protected claim invitation is created.
    InvitationCommand:
      type: object
      description: "`roleIds` cannot be combined with deprecated `roles`, `groupPermissions`, or non-empty `categoryGrants`."
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName:
          type: string
          maxLength: 120
          description: Optional suggested name for a new account.
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Complete explicit group-owned role selection.
          items: { type: string }
        roles:
          type: array
          uniqueItems: true
          deprecated: true
          description: Deprecated preset-role input; custom invitation roles remain intact on legacy updates.
          items: { $ref: '#/components/schemas/LegacyRole' }
        groupPermissions:
          type: array
          uniqueItems: true
          deprecated: true
          items: { $ref: '#/components/schemas/GroupPermission' }
        categoryGrants:
          $ref: '#/components/schemas/LegacyCategoryGrantWrite'
    InvitationUpdate:
      type: object
      description: "`roleIds` cannot be combined with deprecated `roles`, `groupPermissions`, or non-empty `categoryGrants`."
      properties:
        displayName: { type: string, maxLength: 120 }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Complete explicit selected role set.
          items: { type: string }
        roles:
          type: array
          uniqueItems: true
          deprecated: true
          description: Deprecated preset-role input; custom invitation roles remain intact on legacy updates.
          items: { $ref: '#/components/schemas/LegacyRole' }
        groupPermissions:
          type: array
          uniqueItems: true
          deprecated: true
          items: { $ref: '#/components/schemas/GroupPermission' }
        categoryGrants:
          $ref: '#/components/schemas/LegacyCategoryGrantWrite'
    Invitation:
      type: object
      required: [id, groupId, email, roleIds, roleAssignmentsVersion, roles, groupPermissions, categoryGrants, expiresAt, emailDeliveryStatus]
      properties:
        id: { type: string }
        groupId: { type: string }
        targetMembershipId:
          type: string
          readOnly: true
          description: Present only for a temporary-guest claim invitation; acceptance preserves this membership identity and its history.
        email: { type: string, format: email }
        displayName: { type: string }
        roleIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        roleAssignmentsVersion:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Whole-assignment-set version used to construct the pending-invitation roles ETag.
        roles:
          type: array
          deprecated: true
          items: { $ref: '#/components/schemas/LegacyRole' }
        groupPermissions:
          type: array
          uniqueItems: true
          deprecated: true
          items: { $ref: '#/components/schemas/GroupPermission' }
        categoryGrants:
          deprecated: true
          $ref: '#/components/schemas/LegacyCategoryGrants'
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        emailDeliveryStatus: { $ref: '#/components/schemas/EmailDeliveryStatus' }
        emailSentAt: { type: string, format: date-time }
        emailFailureCode: { type: string }
    EmailDeliveryStatus:
      type: string
      enum: [NOT_REQUESTED, PENDING, SENDING, SENT, FAILED, CANCELLED]
    InvitationImportResult:
      type: object
      required: [summary, rows]
      properties:
        summary: { $ref: '#/components/schemas/InvitationImportSummary' }
        rows:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/InvitationImportRow' }
    InvitationImportSummary:
      type: object
      required: [totalRows, created, invalid, skipped]
      properties:
        totalRows: { type: integer, minimum: 1, maximum: 100 }
        created: { type: integer, minimum: 0, maximum: 100 }
        invalid: { type: integer, minimum: 0, maximum: 100 }
        skipped: { type: integer, minimum: 0, maximum: 100 }
    InvitationImportRow:
      type: object
      required: [row, invitationStatus]
      properties:
        row: { type: integer, minimum: 2 }
        email: { type: string, format: email }
        displayName: { type: string, maxLength: 120 }
        invitationId: { type: string }
        invitationStatus:
          type: string
          enum: [CREATED, INVALID, SKIPPED_ALREADY_MEMBER, SKIPPED_ALREADY_INVITED]
        emailDeliveryStatus: { $ref: '#/components/schemas/EmailDeliveryStatus' }
        code:
          type: string
          enum: [invalid_email, invalid_display_name, display_name_too_long, duplicate_email, already_member, already_invited]
    InvitationEmailRetryResult:
      type: object
      required: [invitationId, emailDeliveryStatus]
      properties:
        invitationId: { type: string }
        emailDeliveryStatus:
          type: string
          const: PENDING
    InvitationEmailResendResult:
      type: object
      required: [invitationId, emailDeliveryStatus, expiresAt, acceptUrl]
      properties:
        invitationId: { type: string }
        emailDeliveryStatus:
          type: string
          const: PENDING
        expiresAt: { type: string, format: date-time }
        acceptUrl:
          type: string
          description: New fallback URL on the first idempotent response; empty on a replay.
    Category:
      type: object
      required: [id, groupId, name, icon, active, sortOrder, version]
      properties:
        id: { type: string }
        groupId: { type: string }
        name: { type: string }
        icon: { $ref: '#/components/schemas/CategoryIcon' }
        active: { type: boolean }
        sortOrder: { type: integer }
        version: { type: integer, format: int64 }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }
    CategoryCommand:
      type: object
      required: [name, icon, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        icon: { $ref: '#/components/schemas/CategoryIcon' }
        sortOrder:
          type: integer
          description: Accepted for backward compatibility; newly created categories are appended to the current order.
    CategoryIcon:
      type: string
      enum: [other, drink, food, penalty, sport, event, transport, money]
    CategoryUpdate:
      allOf:
        - $ref: '#/components/schemas/CategoryCommand'
        - type: object
          required: [active, version]
          properties:
            active: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
    CatalogOrderCommand:
      type: object
      required: [categoryIds, productIdsByCategory]
      additionalProperties: false
      properties:
        categoryIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1 }
        productIdsByCategory:
          type: object
          maxProperties: 1000
          additionalProperties:
            type: array
            maxItems: 1000
            uniqueItems: true
            items: { type: string, minLength: 1 }
    Product:
      type: object
      required: [id, groupId, categoryId, name, pricingMode, currency, active, sortOrder, version]
      properties:
        id: { type: string }
        groupId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        priceMinor: { $ref: '#/components/schemas/MinorUnits' }
        pricingMode:
          type: string
          enum: [FIXED, USER_DEFINED]
          description: FIXED exposes priceMinor; USER_DEFINED requires the booking actor to submit a unit price.
        currency: { type: string }
        imageUrl: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
        version: { type: integer, format: int64 }
      oneOf:
        - required: [priceMinor]
          properties:
            pricingMode: { const: FIXED }
        - properties:
            pricingMode: { const: USER_DEFINED }
            priceMinor: false
    ProductCommand:
      type: object
      required: [name, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        priceMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        pricingMode:
          type: string
          enum: [FIXED, USER_DEFINED]
          default: FIXED
        sortOrder:
          type: integer
          description: Accepted for backward compatibility; newly created products are appended within their category.
      oneOf:
        - required: [priceMinor]
          properties:
            pricingMode: { type: string, enum: [FIXED] }
        - required: [pricingMode]
          properties:
            pricingMode: { const: USER_DEFINED }
            priceMinor: false
    ProductUpdate:
      allOf:
        - $ref: '#/components/schemas/ProductCommand'
        - type: object
          required: [active, version]
          properties:
            active: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
    BookingTarget:
      type: object
      additionalProperties: false
      required: [membershipId, displayName, isTemporaryGuest]
      properties:
        membershipId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        isTemporaryGuest:
          type: boolean
          description: True only when the target has no login credentials.
    BookingContext:
      type: object
      additionalProperties: false
      required: [openPeriod, ownBalanceMinor, currentMembership, targets, canBookForGuests]
      properties:
        openPeriod: { $ref: '#/components/schemas/Period' }
        ownBalanceMinor:
          $ref: '#/components/schemas/MinorUnits'
          description: Exact current balance for the authenticated membership only; no group total is included.
        currentMembership: { $ref: '#/components/schemas/Membership' }
        targets:
          type: array
          description: Booking-safe active targets; contains no email, role, grant, balance, or group-structure fields.
          items: { $ref: '#/components/schemas/BookingTarget' }
        canBookForGuests:
          type: boolean
          description: True only when BOOK_FOR_GUESTS is effective; controls inline temporary-guest creation.
    BookingCommand:
      type: object
      required: [productId, productVersion, expectedPeriodId, quantity]
      properties:
        productId: { type: string }
        productVersion: { type: integer, format: int64, minimum: 1 }
        expectedPeriodId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: Required for USER_DEFINED products and forbidden for FIXED products; interpreted as the unit price.
        targetMembershipId: { type: string }
        reason: { type: string, maxLength: 500 }
    BookingBatchCommand:
      type: object
      additionalProperties: false
      required: [productId, productVersion, expectedPeriodId, quantity]
      properties:
        productId: { type: string }
        productVersion: { type: integer, format: int64, minimum: 1 }
        expectedPeriodId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000000
          description: Required for USER_DEFINED products and forbidden for FIXED products; interpreted as the unit price applied to every target.
        targetMembershipIds:
          type: array
          minItems: 0
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1 }
        temporaryGuestDisplayNames:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: |
            Trimmed, control-character-free names for new credentialless guests.
            Normalized duplicates within the command are rejected; names never
            identify or merge existing memberships. Requires BOOK_FOR_GUESTS.
          items: { type: string, minLength: 1, maxLength: 120 }
        reason:
          type: string
          maxLength: 500
          description: Shared reason stored on every created booking; required only when at least one target is another credentialed membership.
      anyOf:
        - required: [targetMembershipIds]
          properties:
            targetMembershipIds: { minItems: 1 }
        - required: [temporaryGuestDisplayNames]
      description: At least one target array must be present and non-empty; the two arrays may be combined but their total item count cannot exceed 100.
    Booking:
      type: object
      required: [id, groupId, periodId, categoryId, productId, actorMembershipId, actorDisplayName, actorMembershipStatus, targetMembershipId, targetDisplayName, targetMembershipStatus, quantity, unitPriceMinor, totalMinor, currency, productName, categoryName, createdAt, canVoid, voidReasonRequired]
      properties:
        id: { type: string }
        groupId: { type: string }
        periodId: { type: string }
        categoryId: { type: string }
        productId: { type: string }
        actorMembershipId: { type: string }
        actorDisplayName:
          type: string
          description: Server-resolved actor name so activity clients do not need the member directory.
        actorMembershipStatus:
          type: string
          enum: [ACTIVE, ARCHIVED, DELETED]
          description: Current lifecycle state used to mark retained historical actors.
        targetMembershipId: { type: string }
        targetDisplayName:
          type: string
          description: Server-resolved charged-member name so activity clients do not need the member directory.
        targetMembershipStatus:
          type: string
          enum: [ACTIVE, ARCHIVED, DELETED]
          description: Current lifecycle state used to mark retained historical booking targets.
        quantity: { type: integer }
        unitPriceMinor: { $ref: '#/components/schemas/MinorUnits' }
        totalMinor: { $ref: '#/components/schemas/MinorUnits' }
        currency: { type: string }
        productName: { type: string }
        categoryName: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time }
        voidReason: { type: string }
        canVoid:
          type: boolean
          description: Whether the current authenticated membership may reverse this booking now.
        voidReasonRequired:
          type: boolean
          description: Whether a reversal by the current authenticated membership requires a non-empty reason.
        voidWithoutReasonUntil:
          type: string
          format: date-time
          description: End of the current actor's reason-free 30-second window; omitted for the target of an incoming booking and every unrelated booking.
    CategoryStatistic:
      type: object
      required: [categoryId, categoryName, icon, quantity, grossMinor, voidedMinor, netMinor]
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        icon: { $ref: '#/components/schemas/CategoryIcon' }
        quantity: { type: integer, format: int64 }
        grossMinor: { $ref: '#/components/schemas/MinorUnits' }
        voidedMinor: { $ref: '#/components/schemas/MinorUnits' }
        netMinor: { $ref: '#/components/schemas/MinorUnits' }
    LedgerEntry:
      type: object
      required: [id, periodId, amountMinor, description, createdAt]
      properties:
        id: { type: string }
        periodId: { type: string }
        bookingId: { type: string }
        paymentId: { type: string }
        reversalOf: { type: string }
        amountMinor: { $ref: '#/components/schemas/MinorUnits' }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    AccountSummary:
      type: object
      required: [membershipId, displayName, isTemporaryGuest, status, currency, balanceMinor]
      properties:
        membershipId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        isTemporaryGuest:
          type: boolean
          readOnly: true
          description: True only while the account has no login credentials.
        status: { type: string, enum: [ACTIVE, ARCHIVED, DELETED] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        balanceMinor: { $ref: '#/components/schemas/MinorUnits' }
    Account:
      type: object
      required: [membershipId, displayName, currency, balanceMinor, openPeriodId, openPeriodDueMinor, categoryStatistics, groupCategoryStatistics, recentEntries]
      properties:
        membershipId: { type: string }
        displayName: { type: string }
        currency: { type: string }
        balanceMinor: { $ref: '#/components/schemas/MinorUnits' }
        openPeriodId: { type: string }
        openPeriodDueMinor: { $ref: '#/components/schemas/MinorUnits' }
        categoryStatistics:
          type: array
          items: { $ref: '#/components/schemas/CategoryStatistic' }
        groupCategoryStatistics:
          type: array
          description: Anonymous current-period category totals across the group; an empty array without VIEW_GROUP_STATISTICS.
          items: { $ref: '#/components/schemas/CategoryStatistic' }
        recentEntries:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/LedgerEntry' }
    Dashboard:
      type: object
      required: [account, openPeriod, recentBookings, unreadNotificationCount]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        openPeriod: { $ref: '#/components/schemas/Period' }
        recentBookings:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        unreadNotificationCount: { type: integer, format: int64 }
        groupOutstandingMinor:
          $ref: '#/components/schemas/MinorUnits'
          description: Group-wide outstanding amount; omitted without FINANCE_MANAGEMENT.
    PaymentCommand:
      type: object
      required: [membershipId, amountMinor, method]
      properties:
        membershipId: { type: string }
        amountMinor: { type: integer, format: int64, minimum: 1 }
        receivedAt: { type: string, format: date-time }
        method: { type: string, enum: [CASH, BANK_TRANSFER, PAYPAL, OTHER] }
        reference: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 1000 }
    SelfPaymentCommand:
      type: object
      required: [amountMinor, receivedAt, method, reference]
      additionalProperties: false
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1, maximum: 100000000000 }
        receivedAt: { type: string, format: date-time }
        method: { type: string, enum: [CASH, BANK_TRANSFER, PAYPAL, OTHER] }
        reference: { type: string, minLength: 1, maxLength: 120 }
    Payment:
      type: object
      required: [id, groupId, membershipId, memberName, membershipStatus, amountMinor, currency, receivedAt, method, status, allocations]
      properties:
        id: { type: string }
        groupId: { type: string }
        membershipId: { type: string }
        memberName: { type: string }
        membershipStatus:
          type: string
          enum: [ACTIVE, ARCHIVED, DELETED]
          description: Current lifecycle state used to mark retained historical payment accounts.
        amountMinor: { $ref: '#/components/schemas/MinorUnits' }
        currency: { type: string }
        receivedAt: { type: string, format: date-time }
        method: { type: string, enum: [CASH, BANK_TRANSFER, PAYPAL, OTHER] }
        reference: { type: string }
        note: { type: string }
        status: { type: string, enum: [POSTED, REVERSED] }
        reversedAt: { type: string, format: date-time }
        allocations:
          type: array
          items:
            type: object
            required: [periodId, amountMinor]
            properties:
              periodId: { type: string }
              amountMinor: { $ref: '#/components/schemas/MinorUnits' }
    Period:
      type: object
      required: [id, groupId, label, status, startsAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        label: { type: string }
        status: { type: string, enum: [OPEN, CLOSED] }
        startsAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        dueAt: { type: string, format: date }
    ClosePeriodCommand:
      type: object
      required: [label, dueAt, nextPeriodLabel]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        dueAt: { type: string, format: date }
        nextPeriodLabel: { type: string, minLength: 1, maxLength: 120 }
    Statement:
      type: object
      required: [id, periodId, membershipId, displayName, chargesMinor, paymentsAllocatedMinor, adjustmentsAppliedMinor, adjustmentsProvidedMinor, amountDueMinor, currency, status]
      properties:
        id: { type: string }
        periodId: { type: string }
        membershipId: { type: string }
        displayName: { type: string }
        email:
          type: [string, 'null']
          format: email
          description: Close-time email snapshot; omitted or null for a credentialless temporary guest.
        chargesMinor: { $ref: '#/components/schemas/MinorUnits' }
        paymentsAllocatedMinor: { $ref: '#/components/schemas/MinorUnits' }
        adjustmentsAppliedMinor:
          $ref: '#/components/schemas/MinorUnits'
          description: Later negative corrections allocated against this period's claim.
        adjustmentsProvidedMinor:
          $ref: '#/components/schemas/MinorUnits'
          description: This period's negative corrections allocated to older claims.
        amountDueMinor: { $ref: '#/components/schemas/MinorUnits' }
        currency: { type: string }
        status: { type: string, enum: [OPEN, PARTIAL, PAID, CREDIT] }
    Notification:
      type: object
      required: [id, groupId, type, title, body, context, createdAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        type:
          type: string
          enum: [BOOKING_ASSIGNED, BOOKING_REVERSED, PAYMENT_RECORDED, PAYMENT_REVERSED, SETTLEMENT_CREATED]
        title: { type: string }
        body: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        context: { $ref: '#/components/schemas/NotificationContext' }
        readAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationContext:
      type: object
      additionalProperties: false
      properties:
        actorName: { type: string }
        itemName: { type: string }
        quantity: { type: integer, minimum: 1 }
        amountMinor: { $ref: '#/components/schemas/MinorUnits' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        periodLabel: { type: string }
        dueAt: { type: string, format: date }
    NotificationSummary:
      type: object
      additionalProperties: false
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, format: int64, minimum: 0 }
    AuditEvent:
      type: object
      required: [id, action, resourceType, metadata, occurredAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        actorUserId: { type: string }
        actorMembershipId: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        existingMembershipId:
          type: string
          description: Present only on a temporary-guest display-name conflict and identifies the active guest that may be explicitly reused.
    RoleConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: Assignment counts are present when deletion is blocked because an editable role is still in use; protected-role conflicts may omit them.
          properties:
            memberCount: { type: integer, format: int64, minimum: 0 }
            pendingInvitationCount: { type: integer, format: int64, minimum: 0 }
