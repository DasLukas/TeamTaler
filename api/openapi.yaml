openapi: 3.1.0
info:
  title: TeamTaler API
  version: 0.9.0
  description: |
    Same-origin JSON API for TeamTaler. Monetary values use integer minor units:
    response fields are exact decimal strings, while command inputs are bounded
    JSON integers.
    State-changing authenticated requests require the `X-CSRF-Token` header.
    Product creation, invitation CSV imports, and financial mutations that
    create or reverse bookings, payments, or periods additionally require an
    `Idempotency-Key`. A batch-booking idempotency scope includes every managed
    guest created by that command. Versioned role and assignment replacement
    or deletion, public join-link updates, system-setting and SMTP revision
    mutations, provisioning-invitation replacement, and global group lifecycle
    commands require a strong `If-Match` ETag where they target an existing
    versioned resource.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Authentication
  - name: Authorization
  - name: System
  - name: Groups
  - name: Catalog
  - name: Bookings
  - name: Finance
  - name: Periods
  - name: Operations
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a local session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: Authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/capabilities:
    get:
      tags: [Authentication]
      summary: Read public account-recovery capabilities
      description: |
        Reports which email-dependent account actions are available in the
        current deployment. The values are derived from complete SMTP and
        authenticated token-encryption configuration; clients may use them to
        hide unavailable entry points. They are capability hints only and do
        not replace server-side checks on later commands.
      security: []
      responses:
        '200':
          description: Current public authentication capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationCapabilities'
  /instance/capabilities:
    get:
      tags: [System]
      summary: Read non-sensitive effective instance capabilities
      description: |
        Public presentation and policy hints. The response contains no setting
        source metadata, SMTP data, account information, or authorization
        state. Clients must still handle policy changes on later commands.
      security: []
      responses:
        '200':
          description: Current public instance capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceCapabilities'
  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Request a password-reset email
      description: |
        Returns the same empty `202` response for known and unknown addresses.
        For an eligible account, the service creates a one-hour, single-use
        request and queues its encrypted token for transactional email
        delivery. The email URL carries the plaintext token only in its
        fragment; the client submits it in the confirmation request body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202': { description: Request accepted without disclosing account existence }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Consume a password-reset token
      description: |
        Replaces the password for the token's account, consumes the token once,
        cancels every other open account-action request, and revokes all
        sessions for that user. The token must come from the reset page URL
        fragment and must never be placed in a request path or query string.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmation'
      responses:
        '204': { description: Password replaced and all sessions revoked }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/email-change/confirm:
    post:
      tags: [Authentication]
      summary: Consume an email-change token
      description: |
        Replaces the account email only after the mailbox token is verified,
        consumes that token once, cancels every other open account-action
        request, and revokes all sessions for the user. User, membership,
        balance, statement, and audit identifiers remain unchanged. The token
        must come from the confirmation page URL fragment.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountActionTokenCommand'
      responses:
        '204': { description: Email replaced and all sessions revoked }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /session:
    get:
      tags: [Authentication]
      summary: Read the current session and group memberships
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
  /permission-definitions:
    get:
      tags: [Authorization]
      summary: List stable permission definitions and implication metadata
      description: |
        Returns the application-defined permission registry. Every definition
        currently reports `GROUP` as its only allowed scope. `CATEGORY` and
        `PRODUCT` remain forward-compatible grant shapes, and v1 role mutations
        reject them.
      responses:
        '200':
          description: Stable permission definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermissionDefinition' }
        '401': { $ref: '#/components/responses/Problem' }
  /me:
    get:
      tags: [Authentication]
      summary: Read the current session and group memberships
      description: Compatibility alias for `/session`.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
  /me/profile:
    patch:
      tags: [Authentication]
      summary: Update the current user's display name
      description: Updates the global account name without changing memberships, accounting history, or sessions.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/group-preference:
    put:
      tags: [Authentication]
      summary: Select the group opened after login
      description: |
        A group identifier selects a fixed default from the current user's
        active memberships. Null selects the most recently used active group.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupPreferenceUpdate' }
      responses:
        '200':
          description: Persisted default-group preference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupPreference' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/group-preference/last-used:
    put:
      tags: [Authentication]
      summary: Record the current group as most recently used
      description: Accepts only a group with an active membership for the current user.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LastUsedGroupUpdate' }
      responses:
        '204': { description: Most recently used group recorded }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /me/password:
    put:
      tags: [Authentication]
      summary: Replace the current user's password
      description: |
        Requires the current password. On success every session for the user,
        including the current session, is revoked.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdate'
      responses:
        '204': { description: Password replaced and all sessions revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /me/email-change:
    post:
      tags: [Authentication]
      summary: Request a verified email-address change
      description: |
        Requires the current password. The current address remains active until
        a one-hour, single-use token sent to `newEmail` is confirmed. Complete
        SMTP and authenticated token-encryption configuration is required. The
        accepted response does not reveal whether another account already uses
        the requested address; in that case no action or email is created.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Verification email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequired'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/push-subscriptions:
    get:
      tags: [Authentication]
      summary: List redacted browser push devices for the current account
      responses:
        '200':
          description: Active account-owned devices without endpoints or browser keys
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/PushSubscriptionDevice' } }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Authentication]
      summary: Reconcile the current browser push subscription
      description: The endpoint and browser keys are validated, encrypted, and never returned. An endpoint already used in a shared browser profile is atomically reassigned to the current account.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionRegistration' }
      responses:
        '201':
          description: Redacted current device
          content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionDevice' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /me/push-subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Authentication]
      summary: Rename an owned browser push device
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties: { label: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '200':
          description: Renamed redacted device
          content: { application/json: { schema: { $ref: '#/components/schemas/PushSubscriptionDevice' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authentication]
      summary: Revoke an owned browser push device
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Device revoked }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/notifications/{notificationId}/destination:
    get:
      tags: [Authentication]
      summary: Resolve an owned opaque notification to its group
      description: |
        Supports privacy-minimized Web Push navigation without placing a group
        identifier in the external payload. Unknown, inaccessible, inactive,
        and archived destinations all return the same `404` response.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Current active group containing the owned notification
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [groupId]
                properties:
                  groupId: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/avatar:
    post:
      tags: [Authentication]
      summary: Validate, normalize, and set the current user's profile image
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Protected content-addressed profile-image URL
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authentication]
      summary: Remove the current user's profile image
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Profile image removed }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{userId}/avatar/{imageKey}:
    get:
      tags: [Authentication]
      summary: Read the current profile image of a user sharing a group
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: imageKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}\.png$'
      responses:
        '200':
          description: Normalized profile image
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /invitations/preview:
    post:
      tags: [Authentication]
      summary: Resolve safe onboarding hints for a valid invitation token
      description: Rate-limited public lookup that never exposes the invited email address, roles, or category grants.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationPreviewCommand' }
      responses:
        '200':
          description: Safe invitation preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /invitations/accept:
    post:
      tags: [Authentication]
      summary: Consume an invitation and create or validate an account
      description: |
        Ordinary invitations create or reactivate a membership with their
        explicit role selection. A temporary-guest claim invitation instead
        attaches credentials or an authenticated existing account to its
        `targetMembershipId`, preserves that membership's accounting identity,
        and applies exactly the invitation's stored roles. A conflicting
        existing membership returns `409` rather than
        merging financial histories. The client must echo the previewed account
        state. If another invitation creates the same global account before
        acceptance, this endpoint returns the typed `invitation-account-state-changed`
        conflict without consuming the token. The client then reloads the
        preview and requests the current account password. Open invitations for
        one canonical email address are atomically bound to the first account
        created for that mailbox; their group-specific roles remain independent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '201':
          description: Joined group and authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/preview:
    post:
      tags: [Authentication]
      summary: Resolve safe group metadata for a valid public join link
      description: |
        Rate-limited public lookup. The opaque join token is supplied from the
        URL fragment by the client and is never included in server access-log
        URLs. The response exposes neither role data nor group identifiers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinTokenCommand' }
      responses:
        '200':
          description: Safe public join-link preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinPreview' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations:
    post:
      tags: [Authentication]
      summary: Start an email-verified account registration through a public link
      description: |
        Queues a one-time verification email for a new account. The accepted
        response is deliberately identical when the normalized email already
        belongs to an account, preventing account enumeration. A membership is
        created only after verification and receives the group's current
        default role at that later point in time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinRegistration' }
      responses:
        '202':
          description: Verification processing accepted without disclosing account existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations/resend:
    post:
      tags: [Authentication]
      summary: Replace and resend a pending public registration proof
      description: Returns the same accepted response when no matching pending registration exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinResendCommand' }
      responses:
        '202':
          description: Verification processing accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationRequired' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /public-join-links/registrations/confirm:
    post:
      tags: [Authentication]
      summary: Verify a public registration and create its account and membership
      description: |
        Atomically consumes the one-time mailbox proof, creates the account and
        membership, assigns the group's current default role, and creates a
        session. Link rotation or deactivation invalidates every pending proof.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinVerificationCommand' }
      responses:
        '201':
          description: Verified account, membership, and authenticated session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /public-join-links/accept:
    post:
      tags: [Authentication]
      summary: Join through a public link with the current authenticated account
      description: |
        Active memberships are returned idempotently. Archived memberships are
        reactivated after their role set is atomically replaced by the group's
        current default role.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinTokenCommand' }
      responses:
        '200':
          description: Joined group and refreshed session view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /system/settings:
    get:
      tags: [System]
      summary: Read effective instance settings
      description: Requires a current `SYSTEM_ADMINISTRATOR` database assignment.
      responses:
        '200':
          description: Effective settings and their current aggregate version
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [System]
      summary: Persist instance-setting overrides
      description: |
        Only supplied fields change. A persisted override wins over its current
        environment and code defaults. Authorization and the ETag are
        revalidated in the serialized write transaction.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettingsUpdate' }
      responses:
        '200':
          description: Updated effective settings
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /system/settings/reset:
    post:
      tags: [System]
      summary: Remove selected persisted setting overrides
      description: The effective value immediately falls back to the current environment or code default.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettingsReset' }
      responses:
        '200':
          description: Effective settings after reset
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /system/settings/smtp:
    put:
      tags: [System]
      summary: Apply persisted SMTP configuration overrides
      description: |
        Applies supplied fields to the TLS-only SMTP override document. A content change creates
        an untested revision and leaves it disabled. Enabling is accepted only
        for the otherwise unchanged current revision after its test succeeds.
        The password is write-only; omit it only to retain an already persisted
        password.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSMTPUpdate' }
      responses:
        '200':
          description: Effective settings with the new disabled SMTP revision
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [System]
      summary: Remove the persisted SMTP override
      description: Restores the current complete environment SMTP configuration or disabled code default.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Effective settings after SMTP reset
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /system/settings/smtp/test:
    post:
      tags: [System]
      summary: Test the current effective SMTP configuration
      description: |
        Sends a test message to the current system administrator account or an
        immutable operator-configured test recipient, then marks only an
        unchanged persisted revision as tested. A host-provided configuration
        is exercised without creating revision state. This command is rate
        limited and never returns SMTP credentials or the recipient override.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: SMTP test succeeded; persisted settings carry a new aggregate revision when verification was required
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /system/settings/web-push:
    put:
      tags: [System]
      summary: Apply persisted Web Push configuration overrides
      description: Updates the redacted VAPID configuration. Replacing an existing private key requires explicit rotation confirmation and causes browsers to register against the new public key identifier.
      parameters:
