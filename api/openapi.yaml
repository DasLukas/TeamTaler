        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /system/audit:
    get:
      tags: [System]
      summary: List append-only global system audit events
      description: |
        Filters, search, sorting, and keyset pagination execute against the full
        authorized system audit table. The existing object response shape is
        retained. Date-only bounds use UTC: `occurredFrom` starts at the selected
        day's 00:00, while `occurredTo` includes the complete selected day by
        becoming an exclusive bound at the next day's 00:00. RFC 3339 upper
        timestamps are exclusive. `q` searches actor name, action, resource type,
        resource identifier, and serialized safe metadata.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TableSearch'
        - $ref: '#/components/parameters/TableCursor'
        - $ref: '#/components/parameters/SortDirection'
        - name: actorUserId
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: Exact action values combined with OR semantics when repeated.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, maxLength: 200 }
        - name: resourceType
          in: query
          description: Exact resource-type values combined with OR semantics when repeated.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, maxLength: 200 }
        - name: occurredFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [occurredAt, actorName, action, resourceType], default: occurredAt }
      responses:
        '200':
          description: Newest global events, including minimal purge receipts
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; omitted on the final page.
              schema: { type: string }
            X-Has-More:
              description: Whether another matching page exists.
              schema: { type: boolean }
            X-Page-Limit:
              description: Effective maximum number of rows in this page.
              schema: { type: integer, minimum: 1, maximum: 200 }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemAuditEvent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
