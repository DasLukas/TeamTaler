    get:
      tags: [Groups]
      summary: Read the active member dashboard
      description: |
        Returns the authenticated membership's personal account data.
        `groupOutstandingMinor` requires `VIEW_GROUP_STATISTICS`; its omission
        must not be interpreted as a zero group balance. The amount spans the
        complete ledger and is independent of settlement periods.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/logo:
    post:
      tags: [Groups]
      summary: Validate, normalize, and set the group logo
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Normalized group-logo URL
          content:
            application/json:
              schema:
                type: object
                required: [logoUrl]
                properties:
                  logoUrl: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Restore the default TeamTaler logo for the group
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Custom group logo removed }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members:
    get:
      tags: [Groups]
      summary: List group members and effective permissions
      description: |
        Requires `VIEW_MEMBER_DIRECTORY`. `BOOK_FOR_OTHERS` implies that
        compatible read permission, while `MEMBER_MANAGEMENT` implies it and
        additionally exposes archived memberships. Callers that only need valid
        booking targets must use the
        privacy-minimized `/booking-context` read model instead of this
        administrative directory.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group members
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/booking-context:
    get:
      tags: [Bookings]
      summary: Read the privacy-minimized context required by the booking workspace
      description: |
        Requires `CREATE_OWN_BOOKING`, `BOOK_FOR_OTHERS`, or `BOOK_FOR_GUESTS`.
        The response never
        includes the group member directory, email addresses, role assignments,
        effective grants for other memberships, or group statistics. Targets
        are filtered independently: own access needs
        `CREATE_OWN_BOOKING`, credentialed members need `BOOK_FOR_OTHERS`, and
        credentialless temporary guests need `BOOK_FOR_GUESTS`. Temporary guests
        sort after credentialed members. `canBookForGuests` also controls inline
        temporary-guest creation.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Minimal current-period, own-balance, and target context
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingContext' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/public-join-link:
    get:
      tags: [Groups]
      summary: Read the member-manager-owned public join-link state
      description: |
        Requires `MEMBER_MANAGEMENT`. The reusable acceptance URL is returned
        only while the single group link is enabled and unexpired. Version zero
        represents a group that has never created a link.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Current public join-link state
          headers:
            ETag:
              description: Strong ETag when a persisted link exists.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Groups]
      summary: Create, enable, disable, or change the lifetime of a public join link
      description: |
        Requires `MEMBER_MANAGEMENT`. The first persisted version omits
        `If-Match`; later replacements require the current strong ETag. Enabling
        a disabled or expired link creates a new token. A null expiry means
        unlimited availability. Enabling requires configured email delivery and
        a non-administrative group default role.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicJoinLinkUpdate' }
      responses:
        '200':
          description: Persisted public join-link state
          headers:
            ETag:
              description: Strong ETag derived from the returned version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/public-join-link/rotate:
    post:
      tags: [Groups]
      summary: Replace the current public join-link token
      description: |
        Requires `MEMBER_MANAGEMENT` and an enabled, unexpired link. Rotation
        invalidates the previous URL, QR code, and all pending registrations in
        the same write transaction while preserving the configured expiry.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Rotated public join-link state
          headers:
            ETag:
              description: Strong ETag derived from the incremented version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicJoinLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/roles:
    get:
      tags: [Authorization]
      summary: List group-owned roles and assignment counts
      description: Requires `ROLE_MANAGEMENT` or `MEMBER_MANAGEMENT` in the requested group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Roles with explicit grants, versions, protection metadata, and assignment counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Authorization]
      summary: Create a group-owned role
      description: |
        Requires `ROLE_MANAGEMENT`. A role containing
        `GROUP_ADMINISTRATION` additionally requires
        `GROUP_ADMINISTRATION`. Only `GROUP` grants are accepted in v1.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCommand' }
      responses:
        '201':
          description: Created role
          headers:
            ETag:
              description: Strong ETag derived from the returned role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/roles/{roleId}:
    get:
      tags: [Authorization]
      summary: Read one group-owned role
      description: Requires `ROLE_MANAGEMENT` in the requested group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Current role
          headers:
            ETag:
              description: Strong ETag derived from the returned role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Authorization]
      summary: Replace a role name, description, and explicit grants
      description: |
        Requires `ROLE_MANAGEMENT`. Changing `GROUP_ADMINISTRATION` or the
        reserved administrator role additionally requires
        `GROUP_ADMINISTRATION`. The reserved role name and its direct
        `GROUP_ADMINISTRATION`, `MEMBER_MANAGEMENT`, and `ROLE_MANAGEMENT`
        grants are immutable. Only `GROUP` grants are accepted in v1.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCommand' }
      responses:
        '200':
          description: Updated role
          headers:
            ETag:
              description: Strong ETag derived from the incremented role version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Authorization]
      summary: Delete an unused editable role
      description: |
        Requires `ROLE_MANAGEMENT` and a matching role version. The reserved
        group-administrator role cannot be deleted; deleting an editable role that contains
        `GROUP_ADMINISTRATION` additionally requires that permission. A role
        assigned to an active membership or pending invitation returns `409`
        with both assignment counts. Expired invitation assignments do not
        block deletion and are removed by cascade.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/RoleId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Role deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/RoleConflictProblem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/role-assignments:
    get:
      tags: [Authorization]
      summary: List aggregated member and pending-invitation role assignments
      description: Requires `MEMBER_MANAGEMENT` in the requested group.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: One complete role-ID set and version per assignment subject
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/roles:
    put:
      tags: [Authorization]
      summary: Replace all role assignments for an active membership
      description: |
        At least one role must remain assigned. Every assignment requires
        `MEMBER_MANAGEMENT`. Reserved administrator assignment changes and any
        other role containing `GROUP_ADMINISTRATION` additionally require
        `GROUP_ADMINISTRATION`. The last active reserved administrator
        assignment cannot be removed.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentUpdate' }
      responses:
        '200':
          description: Replaced membership role assignments
          headers:
            ETag:
              description: Strong ETag derived from the incremented assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/permissions:
    patch:
      tags: [Groups]
      summary: Replace deprecated preset-role and legacy permission fields
      description: |
        Requires `MEMBER_MANAGEMENT`. Deprecated compatibility adapter.
        Preset-role writes preserve custom
        role assignments, `SELF_RECORD_PAYMENT` is mapped through the editable
        migration role, and every non-empty `categoryGrants` value returns
        `422`. Assignment changes use the same authorization policy as the
        dynamic role API and require the current assignment ETag.
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissionUpdate' }
      responses:
        '204':
          description: Permissions replaced
          headers:
            ETag:
              description: Strong ETag derived from the resulting assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}:
    patch:
      tags: [Groups]
      summary: Rename an active temporary guest
      description: |
        Requires `MEMBER_MANAGEMENT`. Only an active credentialless temporary
        guest may be renamed through this endpoint. Credentialed members manage
        their global display name through account flows.
        The normalized display name is written with an audit event. Repeating
        the same replacement is naturally idempotent and needs no
        `Idempotency-Key`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemporaryGuestRenameCommand' }
      responses:
        '200':
          description: Renamed temporary guest membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Archive a membership while preserving all historical records
      description: |
        Requires `MEMBER_MANAGEMENT`. The same lifecycle applies to regular
        memberships and temporary guests. Archival clears
        effective access while preserving the stable membership identifier,
        credentialless identity, bookings, ledger entries, period statements,
        claim-invitation history, notifications, and audit events.
        Archiving a membership with a role that grants `GROUP_ADMINISTRATION`
        additionally requires `GROUP_ADMINISTRATION`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
        - name: confirmSelf
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Must be true when a member archives their own membership.
      responses:
        '204': { description: Membership archived and effective permissions cleared }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/reactivate:
    post:
      tags: [Groups]
      summary: Reactivate an archived membership
      description: |
        Requires `MEMBER_MANAGEMENT`. Credentialed memberships must receive at
        least one role. A role granting `GROUP_ADMINISTRATION` additionally
        requires `GROUP_ADMINISTRATION`. Temporary guests remain roleless and
        may provide a conflict-free replacement display name. Permanently deleted
        memberships cannot be reactivated.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberReactivationCommand' }
      responses:
        '200':
          description: Reactivated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/permanent:
    delete:
      tags: [Groups]
      summary: Permanently remove an archived membership from administration
      description: |
        Requires `MEMBER_MANAGEMENT` and an exact zero consolidated balance.
        The membership identifier and its last display name remain as a
        credentialless tombstone for bookings, payments, ledger entries,
        statements, and audit history. The original account and memberships in
        other groups remain unchanged. Later financial corrections and booking
        reversals may create a new balance on the deleted tombstone account.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Membership removed from administration; historical tombstone retained }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/members/{membershipId}/claim-invitation:
    post:
      tags: [Groups]
      summary: Invite an active temporary guest to claim login access
      description: |
        Requires `MEMBER_MANAGEMENT`. The command creates one seven-day,
        single-use invitation tied to the active credentialless membership and
        records its email outbox work atomically when SMTP is available. The
        fallback URL is returned once. The command accepts no
        `Idempotency-Key`: at most one open claim invitation may target a guest,
        and a repeated request returns `409` without rotating the token or
        sending another message.

        Acceptance preserves the target membership identifier and every
        accounting and audit reference. A new claimant receives credentials on
        the temporary identity; an existing account must authenticate and is
        linked without creating a second membership. At least one role is stored
        with the invitation and applied exactly on acceptance. Member managers
        may select ordinary roles; roles granting `GROUP_ADMINISTRATION`
        additionally require `GROUP_ADMINISTRATION`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemporaryGuestClaimInvitationCommand' }
      responses:
        '201':
          description: Claim invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemporaryGuestClaimInvitationResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations:
    get:
      tags: [Groups]
      summary: List invitation metadata without secret tokens
      description: |
        Requires `MEMBER_MANAGEMENT` and returns the complete invitation
        lifecycle without bearer tokens.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Groups]
      summary: Create a seven-day, one-time invitation and optionally queue its email
      description: |
        Requires `MEMBER_MANAGEMENT`.
        When SMTP delivery is configured, the invitation and its encrypted
        transactional outbox job are committed atomically. The one-time
        acceptance URL is returned regardless of SMTP availability so a group
        member manager can use it as a fallback. A current invitation or group
        membership for the normalized email address prevents duplicates across
        manual creation and CSV imports. Selected `roleIds` and deprecated role
        fields apply the same member-management and administrator-capable-role
        checks as the dedicated assignment endpoint. At least one role must be
        selected explicitly.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCommand' }
      responses:
        '201':
          description: Invitation with delivery status and one-time fallback acceptance URL
          content:
            application/json:
              schema:
                type: object
                required: [invitation, acceptUrl]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  acceptUrl: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/import:
    post:
      tags: [Groups]
      summary: Import invitations with row-specific roles or the group default
      description: |
        Requires `MEMBER_MANAGEMENT`.
        Accepts UTF-8 CSV with a required `email` column and an optional
        `display_name` and `roles` columns. Multiple case-insensitive role names
        in one row are separated by `|`. A blank roles cell uses the deprecated
        shared `roleId` parameters when present, otherwise the group's default
        role. Comma and semicolon separators and an optional UTF-8 BOM are
        supported. Valid rows are committed together with an encrypted
        transactional email-outbox job. A membership is created only after the
        recipient accepts the invitation.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: roleId
          in: query
          required: false
          deprecated: true
          description: Deprecated shared fallback. Repeat for every group-owned role assigned to rows without a roles value.
          schema: { type: array, uniqueItems: true, items: { type: string } }
          style: form
          explode: true
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              maxLength: 262144
              examples:
                - |-
                  email,display_name,roles
                  alex@example.com,Alex Member,Mitglied
                  sam@example.com,Sam Member,Finanzverwaltung|Katalogverwaltung
      responses:
        '200':
          description: Complete or partial row-level import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationImportResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}:
    patch:
      tags: [Groups]
      summary: Replace display-name and compatible role defaults of an open invitation
      description: |
        Requires `MEMBER_MANAGEMENT`.
        Both `roleIds` and deprecated role fields use the current assignment
        policy and require a matching `If-Match`. Legacy role fields preserve
        custom assignments. Non-empty legacy category grants return `422`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationUpdate' }
      responses:
        '200':
          description: Updated invitation metadata
          headers:
            ETag:
              description: Strong ETag derived from the current invitation assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Groups]
      summary: Revoke an open invitation and cancel unsent email delivery
      description: Requires `MEMBER_MANAGEMENT`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204': { description: Invitation revoked }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/roles:
    put:
      tags: [Authorization]
      summary: Replace all role assignments for an ordinary pending invitation
      description: |
        Managed-guest claim invitations have a server-owned guest-role
        assignment and return `409` from this operation.
        At least one role must remain assigned. Every assignment requires
        `MEMBER_MANAGEMENT`. Changing the reserved administrator role or another
        role containing `GROUP_ADMINISTRATION` additionally requires
        `GROUP_ADMINISTRATION`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentUpdate' }
      responses:
        '200':
          description: Replaced pending-invitation role assignments
          headers:
            ETag:
              description: Strong ETag derived from the incremented assignment version.
              schema: { type: string, pattern: '^"v[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/email/retry:
    post:
      tags: [Groups]
      summary: Retry a terminally failed invitation email
      description: Requires `MEMBER_MANAGEMENT`.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Email returned to the delivery queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEmailRetryResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/invitations/{invitationId}/email/resend:
    post:
      tags: [Groups]
      summary: Renew an open invitation
      description: Requires `MEMBER_MANAGEMENT`. Creates a new token and seven-day expiry and always returns its one-time manual fallback URL. Older links become invalid; PENDING and SENDING deliveries are rejected. Active SMTP additionally queues the renewed invitation for email delivery.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: invitationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Renewed invitation with optional queued email delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEmailResendResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories:
    get:
      tags: [Catalog]
      summary: List categories with nested products
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Catalog]
      summary: Create a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCommand' }
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/catalog/order:
    put:
      tags: [Catalog]
      summary: Replace the category and product display order
      description: Atomically persists the complete catalog order. Every category and every product in its owning category must appear exactly once; products cannot be moved between categories.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogOrderCommand' }
      responses:
        '200':
          description: Reordered catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories/{categoryId}:
    patch:
      tags: [Catalog]
      summary: Update or archive a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Catalog]
      summary: Permanently delete an archived, empty, unused category
      description: The category must already be archived, contain no products, and have no booking or ledger history. Historical categories remain archived instead.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Category permanently deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/categories/{categoryId}/products:
    post:
      tags: [Catalog]
      summary: Create a product in a category
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCommand' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/products/{productId}:
    patch:
      tags: [Catalog]
      summary: Update or archive a product
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Catalog]
      summary: Permanently remove an archived product from the catalog
      description: The product must already be archived. Unused products are physically deleted; products referenced by bookings retain an internal tombstone so immutable booking, ledger, settlement, and audit history remains intact. Removed products are no longer returned by catalog APIs and cannot be restored through the API.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '204': { description: Product permanently removed from the catalog }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/products/{productId}/image:
    post:
      tags: [Catalog]
      summary: Validate, normalize, and attach a product image
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Normalized image URL
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: { type: string }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/images/{imageKey}:
    get:
      tags: [Catalog]
      summary: Read a group-referenced immutable product image or group logo
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: imageKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}\.png$'
      responses:
        '200':
          description: Normalized PNG image
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: Image not found }
  /groups/{groupId}/bookings:
    get:
      tags: [Bookings]
      summary: List activity bookings visible to the current member
      description: |
        Members with `VIEW_ALL_BOOKING_ACTIVITY`, including through the
        `VOID_ANY_BOOKING` implication, see complete group history. Other active
        members see actor- and target-relevant activity. Search, filters, sorting,
        and keyset pagination execute only after this tenant and visibility scope
        is fixed. The JSON body remains the existing booking array.

        Repeated `categoryId` and `productId` parameters apply OR semantics
        within their own field and AND semantics across fields.

        `createdFrom` is inclusive and `createdTo` is exclusive for RFC 3339
        timestamps. A date-only lower bound starts at 00:00 UTC; a date-only
        upper bound includes the complete selected day and is evaluated as the
        next day's exclusive 00:00 UTC bound. `q` searches actor, target, product,
        category, reason, total minor units, and posting status.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/TableSearch'
        - $ref: '#/components/parameters/TableCursor'
        - $ref: '#/components/parameters/SortDirection'
        - name: periodId
          in: query
          schema: { type: string }
        - name: actorMembershipId
          in: query
          schema: { type: string }
        - name: targetMembershipId
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          description: One or more category identifiers. Repeat the parameter for multiple values.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items: { type: string }
        - name: productId
          in: query
          description: One or more product identifiers. Repeat the parameter for multiple values.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [POSTED, VOIDED] }
        - name: createdFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: createdTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: amountMin
          in: query
          description: Inclusive lower booking total in minor units.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: amountMax
          in: query
          description: Inclusive upper booking total in minor units.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, amount, targetName, actorName, productName, categoryName, status]
            default: createdAt
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Visible booking snapshots
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; omitted on the final page.
              schema: { type: string }
            X-Has-More:
              description: Whether another matching page exists.
              schema: { type: boolean }
            X-Page-Limit:
              description: Effective maximum number of rows in this page.
              schema: { type: integer, minimum: 1, maximum: 200 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Bookings]
      summary: Create an immutable booking and balanced ledger entries
      description: |
        `CREATE_OWN_BOOKING` permits charging the authenticated membership. A
        different credentialed target requires `BOOK_FOR_OTHERS` and a non-empty
        reason. An existing temporary guest requires `BOOK_FOR_GUESTS` and no
        reason. Inline temporary-guest creation is available through the batch
        command.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingCommand' }
      responses:
        '201':
          description: Created booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/bookings/{bookingId}/void:
    post:
      tags: [Bookings]
      summary: Create an audited permission-gated booking reversal in the open period
      description: |
        `VOID_OWN_BOOKING` covers the current booking actor or charged target.
        Only the actor may omit the reason during the first 30 seconds; later
        actor reversals and target reversals of incoming third-party bookings
        require a reason. A member who is neither actor nor target requires
        `VOID_ANY_BOOKING` and a reason.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Voided booking snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/accounts:
    get:
      tags: [Finance]
      summary: List consolidated member balances with FINANCE_MANAGEMENT
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Active and archived group membership balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccountSummary' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/accounts/me:
    get:
      tags: [Finance]
      summary: Read the current member account
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Consolidated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /groups/{groupId}/accounts/me/movements:
    get:
      tags: [Finance]
      summary: Query the current member's complete receivable movement history
      description: |
        This additive endpoint removes the account response's 50-row presentation
        limit without changing that existing response. Search, typed filters,
        sorting, and keyset pagination are evaluated inside the authenticated
        member's group and membership scope. `createdFrom` is inclusive and
        `createdTo` is exclusive for RFC 3339 timestamps. Date-only bounds select
        UTC calendar days; a date-only upper bound advances to the next day's
        00:00 UTC. `q` searches description, signed minor units, and movement type.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/TableSearch'
        - $ref: '#/components/parameters/TableCursor'
        - $ref: '#/components/parameters/SortDirection'
        - name: periodId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [BOOKING, PAYMENT, REVERSAL, ADJUSTMENT] }
        - name: createdFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: createdTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: amountMin
          in: query
          description: Inclusive lower signed movement amount in minor units.
          schema: { type: integer, format: int64 }
        - name: amountMax
          in: query
          description: Inclusive upper signed movement amount in minor units.
          schema: { type: integer, format: int64 }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, amount, description, type], default: createdAt }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Complete personal movement page
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; omitted on the final page.
              schema: { type: string }
            X-Has-More:
              description: Whether another matching page exists.
              schema: { type: boolean }
            X-Page-Limit:
              description: Effective maximum number of rows in this page.
              schema: { type: integer, minimum: 1, maximum: 200 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LedgerEntry' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/accounts/{membershipId}:
    get:
      tags: [Finance]
      summary: Read a member account with FINANCE_MANAGEMENT
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: Consolidated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments:
    get:
      tags: [Finance]
      summary: List incoming payments
      description: |
        Search, typed filters, sorting, and keyset pagination execute over the
        complete finance-authorized group history. The JSON body remains the
        existing payment array. `receivedFrom` is inclusive and `receivedTo` is
        exclusive for RFC 3339 timestamps. Date-only bounds select UTC calendar
        days; a date-only upper bound advances to the next day's 00:00 UTC. `q`
        searches member name, method identifier and label, reference, note,
        amount minor units, and posting status.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/TableSearch'
        - $ref: '#/components/parameters/TableCursor'
        - $ref: '#/components/parameters/SortDirection'
        - name: membershipId
          in: query
          schema: { type: string }
        - name: method
          in: query
          description: Exact stable payment-method identifier.
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { type: string, enum: [POSTED, REVERSED] }
        - name: receivedFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: receivedTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: amountMin
          in: query
          description: Inclusive lower payment amount in minor units.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: amountMax
          in: query
          description: Inclusive upper payment amount in minor units.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: sort
          in: query
          schema: { type: string, enum: [receivedAt, amount, memberName, method, status], default: receivedAt }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payments
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; omitted on the final page.
              schema: { type: string }
            X-Has-More:
              description: Whether another matching page exists.
              schema: { type: boolean }
            X-Page-Limit:
              description: Effective maximum number of rows in this page.
              schema: { type: integer, minimum: 1, maximum: 200 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Finance]
      summary: Record and FIFO-allocate an incoming payment
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCommand' }
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: { $ref: '#/components/schemas/PaymentCommand' }
                attachment:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or PDF receipt subject to the effective attachment limit.
            encoding:
              command:
                contentType: application/json
      responses:
        '201':
          description: Recorded payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/bookings/batch:
    post:
      tags: [Bookings]
      summary: Atomically create the same booking for existing members and new temporary guests
      description: |
        Creates one immutable booking and balanced ledger pair per unique active
        target membership in a single transaction. Selecting the current
        membership requires `CREATE_OWN_BOOKING`; selecting another credentialed
        membership requires `BOOK_FOR_OTHERS` and a non-empty shared reason.
        Selecting an existing temporary guest or supplying
        `temporaryGuestDisplayNames` requires `BOOK_FOR_GUESTS` and no reason.

        Each temporary guest name creates a credentialless user, a deliberately
        roleless active membership, and its booking inside the same transaction.
        Existing target IDs and new names together are limited to 100. Active
        temporary-guest names are
        case-insensitively unique within the group. Any invalid, duplicate,
        archived, or
        cross-group target, unsafe guest configuration, accounting conflict, or
        notification failure rejects the complete command, including all new
        identities. A name conflict never merges automatically; its `409`
        Problem Details includes `existingMembershipId` so the caller may
        explicitly select that active guest in a later command.

        The idempotency payload includes the normalized names and all booking
        fields. A replay returns the original bookings and guest membership IDs;
        reuse of the key with any different payload returns `409`. Responses are
        ordered by `targetMembershipIds` first and then by
        `temporaryGuestDisplayNames`, preserving each request array's order.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingBatchCommand' }
      responses:
        '201':
          description: Created booking snapshots in target request order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/bookings/bulk:
    post:
      tags: [Bookings]
      summary: Atomically create multiple product bookings for the same targets
      description: |
        Creates every requested product and target combination, including its
        balanced ledger pair, notification, and audit event, in one transaction.
        The command accepts between 1 and 25 distinct product lines, between 1
        and 100 existing or newly created targets, and expands to at most 500
        immutable bookings. Duplicate product IDs are rejected; callers express
        repeated units through each line's quantity.

        Selecting the current membership requires `CREATE_OWN_BOOKING`;
        selecting another credentialed membership requires `BOOK_FOR_OTHERS`
        and the group's configured shared reason; selecting an existing or new
        temporary guest requires `BOOK_FOR_GUESTS`. New temporary guests are
        created once and reused for every product line in the command.

        For a new idempotency key, every target, permission, product version,
        price, quantity, and the open accounting period are revalidated inside
        the write transaction. Any
        invalid input, concurrent catalog change, guest-name conflict, accounting
        conflict, notification failure, or audit failure rolls back the complete
        command. The idempotency payload covers the normalized targets, names,
        reason, period, and ordered product lines. Reusing a key with a different
        payload returns `409`; replaying the same payload returns the original
        result. Responses are ordered by product line first and then by existing
        target IDs followed by new temporary guests, preserving request order.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingBulkCommand' }
      responses:
        '201':
          description: Created booking snapshots in product-line and target request order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments/self:
    post:
      tags: [Finance]
      summary: Record and FIFO-allocate a payment for the authenticated membership
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfPaymentCommand' }
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command: { $ref: '#/components/schemas/SelfPaymentCommand' }
                attachment:
                  type: string
                  format: binary
                  description: One JPEG, PNG, WebP, or PDF receipt subject to the effective attachment limit.
            encoding:
              command:
                contentType: application/json
      responses:
        '201':
          description: Recorded self-service payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments/{paymentId}/attachment:
    get:
      tags: [Finance]
      summary: Download a protected immutable payment receipt
      description: |
        Available only to the payment target or a currently effective
        FINANCE_MANAGEMENT holder in the same active group. Missing receipts,
        foreign-group payments, and unauthorized requests all return 404.
        Images are returned inline; PDFs use attachment disposition.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Validated receipt bytes
          headers:
            Cache-Control:
              schema: { type: string, example: 'private, no-store' }
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/payments/{paymentId}/reverse:
    post:
      tags: [Finance]
      summary: Reverse a payment and rebuild FIFO allocations
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '204': { description: Payment reversed }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/periods:
    get:
      tags: [Periods]
      summary: List accounting periods
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Newest-first periods
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Period' }
  /groups/{groupId}/periods/{periodId}/close:
    post:
      tags: [Periods]
      summary: Permanently close a period and open its successor
      description: Requires FINANCE_MANAGEMENT and settlementsEnabled=true. Disabling settlements never changes the technical open period.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClosePeriodCommand' }
      responses:
        '200':
          description: Closed period, successor, and snapshot count
          content:
            application/json:
              schema:
                type: object
                required: [closedPeriod, openPeriod, statementCount]
                properties:
                  closedPeriod: { $ref: '#/components/schemas/Period' }
                  openPeriod: { $ref: '#/components/schemas/Period' }
                  statementCount: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/periods/{periodId}/statements:
    get:
      tags: [Periods]
      summary: Read statements for one closed period
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: Visible statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
  /groups/{groupId}/settlements:
    get:
      tags: [Periods]
      summary: List visible settlement statements
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: periodId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Settlement statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
  /groups/{groupId}/notifications:
    get:
      tags: [Groups]
      summary: List current member notifications
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/Limit'
        - name: cursor
          in: query
          description: Opaque notification identifier returned in the preceding X-Next-Cursor header.
          schema: { type: string }
      responses:
        '200':
          description: Notifications
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next older page; omitted for the final page.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /groups/{groupId}/notifications/summary:
    get:
      tags: [Groups]
      summary: Read the current member's exact unread notification count
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Unread notification summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationSummary' }
  /groups/{groupId}/notifications/read:
    patch:
      tags: [Groups]
      summary: Acknowledge visible notifications in one bounded batch
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [notificationIds]
              properties:
                notificationIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, minLength: 1 }
      responses:
        '200':
          description: Batch acknowledgement result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/NotificationSummary'
                  - type: object
                    required: [readAt]
                    properties:
                      readAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/notifications/{notificationId}:
    patch:
      tags: [Groups]
      summary: Mark one notification read or unread
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
  /groups/{groupId}/audit:
    get:
      tags: [Groups]
      summary: List append-only administrative audit events
      description: |
        Search, typed filters, sorting, and keyset pagination execute inside the
        authorized group only. The JSON body remains the existing event array.
        `occurredFrom` is inclusive and `occurredTo` is exclusive for RFC 3339
        timestamps. Date-only bounds select UTC calendar days; a date-only upper
        bound advances to the next day's 00:00 UTC. `q` searches actor name,
        action, resource type, resource identifier, and serialized safe metadata.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/TableSearch'
        - $ref: '#/components/parameters/TableCursor'
        - $ref: '#/components/parameters/SortDirection'
        - name: actorUserId
          in: query
          schema: { type: string }
        - name: actorMembershipId
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: Exact action values combined with OR semantics when repeated.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, maxLength: 200 }
        - name: resourceType
          in: query
          description: Exact resource-type values combined with OR semantics when repeated.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { type: string, maxLength: 200 }
        - name: occurredFrom
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema:
            oneOf:
              - { type: string, format: date }
              - { type: string, format: date-time }
        - name: sort
          in: query
          schema: { type: string, enum: [occurredAt, actorName, action, resourceType], default: occurredAt }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events
          headers:
            X-Next-Cursor:
              description: Opaque cursor for the next page; omitted on the final page.
              schema: { type: string }
            X-Has-More:
              description: Whether another matching page exists.
              schema: { type: boolean }
            X-Page-Limit:
              description: Effective maximum number of rows in this page.
              schema: { type: integer, minimum: 1, maximum: 200 }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /groups/{groupId}/audit/filter-options:
    get:
      tags: [Groups]
      summary: List group-audit filter options
      description: Returns every distinct action and resource type currently present in the authorized group audit log. Newly recorded values appear automatically.
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Complete data-derived group-audit filter catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFilterOptions' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /health/live:
    get:
      tags: [Operations]
      summary: Process liveness probe
      security: []
      servers:
        - url: /
      responses:
        '200': { description: Process is live }
  /health/ready:
    get:
      tags: [Operations]
      summary: Database readiness probe
      security: []
      servers:
        - url: /
      responses:
        '200': { description: Database is ready }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: teamtaler_session
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string }
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional strong resource ETag; conditionally required by commands that include versioned role assignments.
      schema: { type: string }
    RequiredIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong entity tag containing the current resource version, for example `"v3"`.
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    TableSearch:
      name: q
      in: query
      description: Case-insensitive global contains search across the table's documented display fields.
      schema: { type: string, maxLength: 200 }
    TableCursor:
      name: cursor
      in: query
      description: Opaque continuation token from X-Next-Cursor. It is valid only with the same filters, sort, direction, and authorization scope.
      schema: { type: string, maxLength: 2048 }
    SortDirection:
      name: direction
      in: query
      description: Sort direction; descending is the compatibility default.
      schema: { type: string, enum: [asc, desc], default: desc }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RoleConflictProblem:
      description: RFC 9457 conflict details including current role assignment counts
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RoleConflictProblem' }
  schemas:
    MinorUnits:
      type: string
      pattern: '^-?[0-9]+$'
      description: Exact signed integer amount in the currency's minor unit, encoded as a decimal string to preserve 64-bit precision in browsers.
      examples: ['1250']
    LoginCommand:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 1024 }
    AuthenticationCapabilities:
      type: object
      additionalProperties: false
      required: [passwordResetAvailable, emailChangeAvailable]
      properties:
        passwordResetAvailable:
          type: boolean
          readOnly: true
          description: Whether password-reset email delivery is currently configured.
        emailChangeAvailable:
          type: boolean
          readOnly: true
          description: Whether verified email-address changes are currently configured.
    InstanceCapabilities:
      type: object
      additionalProperties: false
      required: [instanceName, maintenanceMode, publicJoinEnabled, mediaUploadMaxBytes, attachmentUploadMaxBytes, emailNotificationsAvailable, webPushAvailable]
      properties:
        instanceName:
          type: string
          minLength: 1
          maxLength: 120
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string
          maxLength: 240
        publicJoinEnabled:
          type: boolean
          description: Effective global policy; a group link may impose additional restrictions.
        mediaUploadMaxBytes:
          type: integer
          format: int64
          minimum: 1048576
          maximum: 26214400
        attachmentUploadMaxBytes:
          type: integer
          format: int64
          minimum: 1048576
          maximum: 52428800
          description: Effective maximum raw size of one payment receipt.
        emailNotificationsAvailable: { type: boolean }
        webPushAvailable: { type: boolean }
        webPushPublicKey: { type: string }
        webPushKeyId: { type: string }
    PushSubscriptionDevice:
      type: object
      additionalProperties: false
      required: [id, deviceLabel, keyId, current, createdAt, lastUsedAt]
      properties:
        id: { type: string }
        deviceLabel: { type: string, minLength: 1, maxLength: 80 }
        keyId: { type: string }
        current: { type: boolean, description: Whether this device uses the current VAPID identity. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    PushSubscriptionRegistration:
      type: object
      additionalProperties: false
      required: [label, keyId, subscription]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        keyId: { type: string }
        subscription:
          type: object
          additionalProperties: false
          required: [endpoint, keys]
          properties:
            endpoint: { type: string, format: uri, maxLength: 2048 }
            expirationTime: { type: [integer, 'null'], format: int64 }
            keys:
              type: object
              additionalProperties: false
              required: [auth, p256dh]
              properties:
                auth: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
                p256dh: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
    SystemRole:
      type: string
      enum: [SYSTEM_ADMINISTRATOR]
    SystemSettingSource:
      type: string
      enum: [DATABASE, ENVIRONMENT, CODE]
    EffectiveStringSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: string }
        source: { $ref: '#/components/schemas/SystemSettingSource' }
        overrideVersion:
          type: integer
          format: int64
          minimum: 1
          description: Present only when the value comes from a persisted database override.
        updatedAt:
          type: string
          format: date-time
          description: Present only when a persisted override supplies the value.
    EffectiveBooleanSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: boolean }
        source: { $ref: '#/components/schemas/SystemSettingSource' }
        overrideVersion:
          type: integer
          format: int64
          minimum: 1
          description: Present only when the value comes from a persisted database override.
        updatedAt:
          type: string
          format: date-time
          description: Present only when a persisted override supplies the value.
    EffectiveIntegerSetting:
      type: object
      additionalProperties: false
      required: [value, source]
      properties:
        value: { type: integer, format: int64 }
        source: { $ref: '#/components/schemas/SystemSettingSource' }
        overrideVersion:
          type: integer
          format: int64
          minimum: 1
          description: Present only when the value comes from a persisted database override.
        updatedAt:
          type: string
          format: date-time
          description: Present only when a persisted override supplies the value.
    SystemSecretSetting:
      type: object
      additionalProperties: false
      required: [configured, source]
      properties:
        configured: { type: boolean }
        source: { $ref: '#/components/schemas/SystemSettingSource' }
        overrideVersion: { type: integer, format: int64, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    SystemSMTPConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, host, port, tlsMode, username, password, fromAddress, fromName, revision, testStatus, requiresTest, configurationValid, active]
      properties:
        enabled: { $ref: '#/components/schemas/EffectiveBooleanSetting' }
        host: { $ref: '#/components/schemas/EffectiveStringSetting' }
        port:
          allOf:
            - $ref: '#/components/schemas/EffectiveIntegerSetting'
          description: Effective SMTP submission port. The code default is `587`.
        tlsMode:
          allOf:
            - $ref: '#/components/schemas/EffectiveStringSetting'
          description: Effective value is `starttls` or `tls`; plaintext SMTP is unsupported.
        username: { $ref: '#/components/schemas/EffectiveStringSetting' }
        fromAddress: { $ref: '#/components/schemas/EffectiveStringSetting' }
        fromName: { $ref: '#/components/schemas/EffectiveStringSetting' }
        password:
          $ref: '#/components/schemas/SystemSecretSetting'
        revision:
          type: integer
          format: int64
          minimum: 0
        testedRevision:
          type: integer
          format: int64
          minimum: 1
        testedAt:
          type: string
          format: date-time
        testStatus:
          type: string
          enum: [UNTESTED, VERIFIED, FAILED]
          description: Persisted result for the current database-backed SMTP revision.
        requiresTest:
          type: boolean
          description: True when persisted SMTP connection settings must be tested before activation.
        configurationValid:
          type: boolean
          description: Whether the redacted effective fields form a complete TLS-secured configuration.
        active:
          type: boolean
          description: True only when enabled, complete, and trusted or tested at the current SMTP revision.
    SystemWebPushConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, subject, vapidPrivateKey, revision, storageKeyConfigured, configurationValid, active]
      properties:
        enabled: { $ref: '#/components/schemas/EffectiveBooleanSetting' }
        subject: { $ref: '#/components/schemas/EffectiveStringSetting' }
        vapidPrivateKey: { $ref: '#/components/schemas/SystemSecretSetting' }
        publicKey: { type: string, description: URL-safe VAPID public key derived whenever the effective private key is valid. }
        keyId: { type: string, description: SHA-256 public-key identifier used for browser reconciliation. }
        revision: { type: integer, format: int64, minimum: 0 }
        storageKeyConfigured: { type: boolean }
        configurationValid: { type: boolean }
        active: { type: boolean }
    SystemSettings:
      type: object
      additionalProperties: false
      required: [revision, instanceName, defaultCurrency, mediaUploadMaxBytes, mediaUploadHardLimitBytes, attachmentUploadMaxBytes, attachmentUploadHardLimitBytes, publicJoinEnabled, maintenanceMode, maintenanceMessage, smtp, webPush, updatedAt]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        instanceName: { $ref: '#/components/schemas/EffectiveStringSetting' }
        defaultCurrency: { $ref: '#/components/schemas/EffectiveStringSetting' }
