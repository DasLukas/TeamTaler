          type: boolean
          deprecated: true
        paymentMethods:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/PaymentMethod' }
        bookingReasons:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ConfigurableItem' }
        paymentReasons:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ConfigurableItem' }
