          description: Group restored to its active or provisioning pre-archive state
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /system/groups/{groupId}/invitation/resend:
    post:
      tags: [System]
      summary: Replace a provisioning group's first-administrator invitation
      description: |
        Requires a live `SYSTEM_ADMINISTRATOR` assignment and is available only
        while the group is `PROVISIONING`. The
        command atomically revokes every open invitation for the group, cancels
        its pending or retryable invitation-email work, creates a fresh
        seven-day first-administrator invitation with a newly generated token,
        returns its one-time acceptance URL, optionally queues encrypted email
        delivery when SMTP is active, and increments the managed-group version.
        Every older invitation link remains invalid.
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/RequiredIfMatch'
      responses:
        '200':
          description: Managed provisioning group after invitation replacement
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemGroupInvitationResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
  /system/groups/{groupId}/deletion-impact:
    get:
      tags: [System]
      summary: Read permanent-deletion impact counts before archival or purge
