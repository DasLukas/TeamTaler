  /system/groups:
    get:
      tags: [System]
      summary: List every group and lifecycle impact summary
      responses:
        '200':
          description: Global lifecycle list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SystemGroup' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [System]
      summary: Create or provision a group with its initial administrator
      description: |
        An existing account produces an active group immediately. An unknown
        email address produces a provisioning group plus a protected
        first-administrator invitation and returns its one-time acceptance URL.
        When effective SMTP is active, the same invitation is also queued for
        email delivery. The acting system administrator is never joined implicitly.
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemGroupCreate' }
      responses:
        '201':
          description: Active or provisioning group
          headers:
            ETag:
              schema: { type: string }
          content:
