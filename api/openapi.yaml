        - attachment.upload_max_bytes
        - access.public_join_enabled
        - maintenance.enabled
        - maintenance.message
        - smtp.enabled
        - smtp.host
        - smtp.port
        - smtp.tls_mode
        - smtp.username
        - smtp.from_address
        - smtp.from_name
        - smtp.password
        - web_push.enabled
        - web_push.subject
        - web_push.vapid_private_key
