name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./cmd/... ./internal/... ./migrations
      - name: Build
        run: go build -trimpath ./cmd/teamtaler

  backend-race:
    name: Backend race (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            packages: >-
              ./cmd/...
              ./internal/activities
              ./internal/audit
              ./internal/auth
              ./internal/authorization
              ./internal/backup
              ./internal/bookings
              ./internal/catalog
              ./internal/config
              ./internal/domain
              ./internal/email
              ./internal/exporting/...
              ./internal/exportnotifications
              ./internal/finance
              ./internal/groups
              ./internal/idempotency
              ./internal/ledger
              ./internal/media
              ./internal/memberimport
              ./internal/notifications
              ./internal/paymentattachments
              ./internal/periods
              ./internal/platform
              ./internal/tablequery
              ./internal/webpush
              ./migrations
          - name: httpapi
            packages: ./internal/httpapi
          - name: integration
            packages: ./internal/integration
          - name: planning
            packages: ./internal/planning
          - name: storage-system
            packages: ./internal/storage ./internal/system
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: true
      - name: Test with race detector
        run: go test -race -p 2 -coverprofile=coverage-${{ matrix.name }}.out ${{ matrix.packages }}
      - name: Upload backend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ matrix.name }}
          path: coverage-${{ matrix.name }}.out

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload frontend build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: web/dist

  container:
    name: Container smoke test
    needs:
      - backend
      - backend-race
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: teamtaler:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify command surface
        run: docker run --rm teamtaler:test version
