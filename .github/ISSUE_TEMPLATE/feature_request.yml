name: Feature request
description: Propose an improvement that fits TeamTaler's product and security model.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user problem should TeamTaler solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior rather than a specific implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, accounting, or deployment constraints
